<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>생각놀이섬</title>
<!-- 생각놀이섬 v1.0(2026-11-01, 데스크톱, 학생용 월드 3). 엔진 think.js · 글 kids.config.js · 섬 assets/island.glb(블렌더로 구움, PC 원본 out\생각놀이섬). 저장소판은 publish_repo.ps1이 복사(리니 GLB는 ../plaza/assets 것을 씀). 화면 글꼴은 맑은 고딕 계열. -->
<style>
  :root { --A:#ffc94d; --A2:#f0a91e; --C:#23a98f; --T:#ec5f4b; --E:#8a6cf0; --ink:#3a3550; --sub:#6d6888; --line:#ece8f6; --act:#8f8aa8; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#bcdcfa; font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; color:var(--ink); word-break:keep-all; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; touch-action:none; }
  button { font:inherit; color:inherit; cursor:pointer; }
  [hidden] { display:none !important; }
  /* 첫 화면 */
  #cover { position:fixed; inset:0; display:grid; place-items:center; z-index:10; padding:16px;
    background:linear-gradient(rgba(190,222,250,.35),rgba(255,247,230,.75)), url(cover.jpg) center/cover no-repeat, #cfe6fb; }
  #cover .box { width:100%; max-width:440px; background:#fff; border-radius:26px; padding:28px 24px 22px; text-align:center; box-shadow:0 6px 0 rgba(58,53,80,.12),0 20px 50px rgba(30,40,80,.22); }
  #cover .k { color:#4f8fd0; font-weight:800; font-size:14px; }
  #cover h1 { margin:6px 0 10px; font-size:32px; letter-spacing:-.5px; }
  #cover p { margin:0 0 16px; color:var(--sub); font-size:15.5px; line-height:1.6; }
  #cover .acts { display:flex; gap:6px; justify-content:center; margin-bottom:16px; flex-wrap:wrap; }
  #cover .acts span { font-size:13px; font-weight:800; border-radius:999px; padding:5px 11px; color:#fff; }
  #startBtn, #restartBtn { display:block; width:100%; border:0; border-radius:16px; padding:15px; font-size:18px; font-weight:900; margin-top:10px; }
  #startBtn { background:var(--A2); color:#fff; box-shadow:0 4px 0 #c9850b; }
  #startBtn[disabled] { background:#e4e2ec; color:#9a95b3; box-shadow:none; }
  #restartBtn { background:#f1eff8; color:var(--sub); font-size:15px; padding:11px; }
  #cover small { display:block; margin-top:12px; font-size:11.5px; color:#9a95b3; line-height:1.5; }
  #loading { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:rgba(40,50,90,.78); color:#fff; padding:8px 14px; border-radius:20px; font-size:13px; z-index:11; }
  /* 놀이 중 화면 틀 */
  .hud { position:fixed; z-index:4; display:none; }
  body.playing .hud { display:flex; }
  #top { left:12px; right:12px; top:calc(10px + env(safe-area-inset-top,0px)); align-items:center; gap:8px; pointer-events:none; }
  #top > * { pointer-events:auto; }
  #zoneChip { background:#fff; border-radius:999px; padding:6px 14px 6px 6px; font-weight:900; font-size:16px; display:flex; gap:8px; align-items:center; box-shadow:0 3px 0 rgba(58,53,80,.12); white-space:nowrap; }
  #zoneChip i { font-style:normal; color:#fff; border-radius:999px; font-size:12px; padding:4px 9px; }
  .sp { flex:1; }
  #badges { background:rgba(255,255,255,.95); border-radius:999px; padding:6px 12px; font-weight:800; font-size:14px; display:flex; gap:6px; align-items:center; box-shadow:0 3px 0 rgba(58,53,80,.12); }
  .badge { width:28px; height:28px; border-radius:50%; border:3px dashed; display:grid; place-items:center; font-weight:900; font-size:12px; color:#bbb6cc; transition:transform .2s; }
  .badge[data-k=A] { border-color:var(--A2); } .badge[data-k=C] { border-color:var(--C); } .badge[data-k=T] { border-color:var(--T); }
  .badge.got { border-style:solid; color:#fff; } .badge.got[data-k=A] { background:var(--A2); } .badge.got[data-k=C] { background:var(--C); } .badge.got[data-k=T] { background:var(--T); }
  .badge.pop { animation:pop .7s ease; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.6)} 100%{transform:scale(1)} }
  #menuBtn, #sndBtn { border:0; background:#fff; border-radius:999px; padding:8px 12px; font-weight:800; font-size:13px; box-shadow:0 3px 0 rgba(58,53,80,.12); white-space:nowrap; }
  #sndBtn.off { color:#9a95b3; text-decoration:line-through; }
  .expwrap { position:relative; }
  .ff { position:absolute; left:12px; right:12px; bottom:12px; height:30px; border-radius:999px; background:rgba(255,255,255,.92); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; color:var(--T); box-shadow:0 2px 0 rgba(0,0,0,.08); }
  .ff i { position:absolute; left:0; top:0; bottom:0; width:0; background:#ffe1da; animation:ff 1.25s linear forwards; }
  .ff span { position:relative; }
  @keyframes ff { to { width:100%; } }
  .fact { margin-top:10px; border-radius:14px; background:#eafaf4; border:2px solid #bde8dc; padding:9px 12px; font-size:14.5px; font-weight:800; line-height:1.5; }
  .fact b { display:block; font-size:12px; color:var(--C); margin-bottom:2px; }
  .cert .cr { font-size:13px; font-weight:800; color:var(--sub); margin-top:2px; }
  @media (prefers-reduced-motion: reduce) { .ff i { animation-duration:.01s; } .methods.shake, .badge.pop { animation:none; } }
  #bottom { left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom,0px)); gap:8px; align-items:center; }
  #hint { background:rgba(255,255,255,.95); border-radius:999px; padding:9px 16px; font-weight:800; font-size:15px; box-shadow:0 3px 0 rgba(58,53,80,.12); white-space:nowrap; }
  #guideBtn { border:0; background:var(--A2); color:#fff; border-radius:999px; padding:10px 16px; font-weight:900; font-size:15px; box-shadow:0 3px 0 #c9850b; white-space:nowrap; }
  #guideBtn.on { background:#8f8aa8; box-shadow:0 3px 0 #6d6888; }
  body.carding #bottom { display:none; }
  #help { position:fixed; left:50%; top:calc(62px + env(safe-area-inset-top,0px)); transform:translateX(-50%); background:rgba(40,50,90,.72); color:#fff; padding:9px 16px; border-radius:18px; font-size:14px; z-index:4; transition:opacity .8s; width:max-content; max-width:calc(100vw - 32px); text-align:center; line-height:1.4; display:none; }
  #toast { position:fixed; left:50%; top:calc(110px + env(safe-area-inset-top,0px)); transform:translateX(-50%) translateY(-8px); background:#fff; border:3px solid #ffd27a; color:var(--ink); padding:9px 16px; border-radius:16px; font-weight:800; font-size:14.5px; z-index:6; opacity:0; transition:.3s; pointer-events:none; max-width:calc(100vw - 32px); text-align:center; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #stick { position:fixed; left:calc(22px + env(safe-area-inset-left,0px)); bottom:calc(84px + env(safe-area-inset-bottom,0px)); width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.22); border:2px solid rgba(255,255,255,.7); z-index:4; display:none; touch-action:none; }
  #stick i { position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px 0 0 -25px; border-radius:50%; background:rgba(255,255,255,.85); box-shadow:0 2px 8px rgba(0,0,0,.25); }
  body.carding #stick { display:none !important; }
  /* 놀이 카드 */
  #card { position:fixed; z-index:8; left:24px; top:76px; width:min(560px, calc(100vw - 48px)); max-height:calc(100vh - 100px); overflow:auto; background:#fff; border-radius:26px; padding:18px 20px 18px; box-shadow:0 6px 0 rgba(58,53,80,.12),0 18px 40px rgba(30,40,80,.25); border-top:6px solid var(--act); }
  #card.wide { width:min(620px, calc(100vw - 48px)); }
  .chead { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .chead .zone, .chead .cstep { white-space:nowrap; }
  .chead .zone { display:flex; gap:7px; align-items:center; font-weight:900; font-size:17px; }
  .chead .zone i { font-style:normal; background:var(--act); color:#fff; border-radius:999px; font-size:12px; padding:3px 9px; }
  .chead .cstep { font-size:12.5px; font-weight:800; color:var(--sub); background:#f3f1fa; border-radius:999px; padding:4px 10px; }
  .chead .x { margin-left:auto; border:0; background:#f3f1fa; width:34px; height:34px; border-radius:50%; font-size:20px; color:var(--sub); }
  .who { display:flex; gap:12px; align-items:center; }
  .face { width:64px; height:64px; border-radius:50%; overflow:hidden; border:4px solid var(--act); flex:none; background:#eaf3ff; }
  .face img { width:100%; height:100%; object-fit:cover; display:block; }
  .face.noimg { background:#eaf3ff url() center/cover; }
  .bubble { position:relative; background:#fff7df; border-radius:16px; padding:10px 14px; font-size:15.5px; line-height:1.5; font-weight:700; }
  .bubble:before { content:""; position:absolute; left:-9px; top:20px; border:9px solid transparent; border-right-color:#fff7df; border-left:0; }
  .riddle { margin-top:12px; border:3px dashed #f3d27a; border-radius:16px; padding:11px 14px; display:flex; gap:12px; align-items:center; }
  .riddle .sprout { width:48px; height:48px; flex:none; }
  .riddle p { margin:0; font-size:18px; font-weight:900; line-height:1.45; letter-spacing:-.3px; white-space:pre-line; }
  .riddle small { display:block; font-size:12px; color:var(--sub); font-weight:700; margin-bottom:2px; }
  h3 { margin:14px 0 0; font-size:15.5px; font-weight:900; display:flex; align-items:center; gap:8px; }
  h3 .cnt { font-size:12.5px; background:#eafaf4; color:var(--C); border-radius:999px; padding:2px 8px; }
  .choices { margin-top:9px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .choices.three { grid-template-columns:1fr 1fr 1fr; }
  .choice { border:3px solid var(--line); border-radius:14px; padding:10px 12px; font-size:15.5px; font-weight:800; display:flex; gap:9px; align-items:center; background:#fff; text-align:left; }
  .choice b { width:26px; height:26px; border-radius:50%; background:#f3f1fa; display:grid; place-items:center; font-size:12.5px; color:var(--sub); flex:none; }
  .choice.sel { border-color:var(--act); background:#fffaf0; box-shadow:0 3px 0 rgba(0,0,0,.06); }
  .choice.sel b { background:var(--act); color:#fff; }
  .sure { margin-top:12px; display:flex; align-items:center; gap:12px; background:#f7f5fc; border-radius:14px; padding:9px 13px; }
  .sure .q { font-size:14.5px; font-weight:900; }
  .dots { display:flex; gap:6px; }
  .dots button { border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11.5px; font-weight:800; color:var(--sub); padding:0 4px; }
  .dots button:before { content:""; width:26px; height:26px; border-radius:50%; border:3px solid var(--A2); background:#fff; }
  .dots button.on:before { background:var(--A); }
  .go { margin-top:14px; display:flex; justify-content:flex-end; align-items:center; gap:8px; flex-wrap:wrap; }
  .go small { margin-right:auto; font-size:11.5px; color:#9a95b3; font-weight:700; }
  .btn { border:0; background:var(--act); color:#fff; border-radius:999px; padding:12px 20px; font-size:16px; font-weight:900; box-shadow:0 4px 0 rgba(0,0,0,.18); }
  .btn[disabled] { background:#e4e2ec; color:#9a95b3; box-shadow:none; cursor:default; }
  .ghost { border:2px solid var(--line); background:#fff; border-radius:999px; padding:10px 16px; font-size:14.5px; font-weight:800; color:var(--sub); }
  .route { margin-top:12px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px; font-weight:800; color:#b0abc4; }
  .route span { color:#fff; border-radius:999px; padding:4px 10px; }
  .route .A { background:var(--A2); } .route .C { background:var(--C); } .route .T { background:var(--T); } .route .E { background:var(--E); }
  .sentence { margin-top:9px; min-height:48px; border-radius:14px; background:#fff8e6; border:3px solid #f3d27a; padding:10px 14px; font-size:17px; font-weight:900; }
  .sentence.empty { color:#c4bfd6; font-weight:700; background:#faf9fd; border-color:var(--line); }
  .chips { margin-top:9px; display:flex; flex-wrap:wrap; gap:7px; }
  .chips button { border:2px solid var(--line); border-radius:12px; padding:8px 12px; font-size:15px; font-weight:800; background:#fff; }
  .chips button.used { background:#fff3cf; border-color:#f3d27a; }
  .heard { margin-top:12px; border-radius:14px; background:#f2fbf8; border:3px solid #bde8dc; padding:10px 14px; font-size:16px; font-weight:900; }
  .heard small { display:block; font-size:12px; color:var(--C); margin-bottom:2px; }
  .methods { margin-top:9px; display:grid; gap:7px; }
  .method { border:3px solid var(--line); border-radius:14px; padding:10px 13px; font-size:15px; font-weight:800; background:#fff; text-align:left; }
  .method small { display:block; margin-top:4px; font-size:13px; font-weight:700; color:var(--C); }
  .method.ok { border-color:var(--C); background:#effaf6; }
  .method.no { border-color:#f2a093; background:#fff1ee; }
  .method[disabled] { cursor:default; }
  .methods.shake { animation:shake .5s; }
  @keyframes shake { 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
  .exp { display:block; width:100%; margin-top:12px; border-radius:16px; }
  .lines { margin-top:12px; display:grid; gap:9px; }
  .ln { border-radius:14px; background:#f7f5fc; padding:10px 12px; }
  .ln b { display:block; font-size:13px; color:var(--T); margin-bottom:6px; }
  .ln .fixed { font-size:15.5px; font-weight:900; }
  .opts { display:grid; gap:6px; }
  .opts button { border:2px solid var(--line); border-radius:12px; padding:8px 11px; font-size:14.5px; font-weight:800; background:#fff; text-align:left; }
  .opts button.ok { border-color:var(--C); background:#effaf6; } .opts button.no { border-color:#f2a093; background:#fff1ee; }
  .cert { margin-top:12px; border-radius:18px; border:4px solid var(--E); padding:14px; text-align:center; background:linear-gradient(#f6f2ff,#fff); }
  .cert .ct { font-size:20px; font-weight:900; }
  .cert label { display:block; margin-top:8px; font-size:13px; font-weight:800; color:var(--sub); }
  .cert input { font:inherit; font-size:16px; font-weight:800; border:2px solid var(--line); border-radius:10px; padding:6px 10px; width:60%; text-align:center; }
  .cb { display:flex; justify-content:center; gap:14px; margin:12px 0 4px; }
  .cbd { width:58px; height:58px; border-radius:50%; background:#e5e2ef; color:#fff; font-weight:900; font-size:22px; display:grid; place-items:center; line-height:1; }
  .cbd.got { background:var(--c); }
  .cbd small { display:block; font-size:10px; margin-top:-8px; }
  .c3 { text-align:left; margin-top:8px; }
  .c3 p, .cp { margin:4px 0; font-size:14px; font-weight:700; } .c3 b, .cp b { color:var(--E); margin-right:8px; }
  .cp { text-align:left; }
  .certimg { margin-top:12px; text-align:center; } .certimg img { width:100%; border-radius:14px; display:block; } .certimg small { display:block; margin-top:6px; font-size:12.5px; font-weight:700; color:var(--sub); }
  /* 휴대폰 세로: 카드는 아래에서 올라오는 판 */
  @media (max-width: 640px) {
    #card, #card.wide { left:8px; right:8px; width:auto; top:auto; bottom:calc(8px + env(safe-area-inset-bottom,0px)); max-height:78vh; border-radius:22px; padding:14px 14px 14px; }
    .choices.three { grid-template-columns:1fr; }
    .choice { font-size:14.5px; padding:9px 10px; }
    #zoneChip { font-size:14px; } #badges { font-size:12px; } #badges .lbl { display:none; }
    #top { flex-wrap:wrap; row-gap:6px; } #top .sp { flex:1 0 auto; }
    #sndBtn, #menuBtn { font-size:12px; padding:6px 10px; }
    #sndBtn { margin-left:auto; }
    #help { top:calc(104px + env(safe-area-inset-top,0px)); } #toast { top:calc(150px + env(safe-area-inset-top,0px)); }
    .chead .zone { font-size:15.5px; } .chead .cstep { font-size:11.5px; }
    #hint { font-size:13px; padding:8px 12px; white-space:normal; max-width:56vw; }
    #guideBtn { font-size:14px; padding:9px 13px; }
    #bottom { left:auto; right:12px; transform:none; flex-direction:column; align-items:flex-end; }
    .face { width:52px; height:52px; } .bubble { font-size:14.5px; }
    .riddle p { font-size:16px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="cover"><div class="box">
  <div class="k" id="cvK"></div><h1 id="cvT"></h1><p id="cvP"></p>
  <div class="acts"><span style="background:var(--A2)">A 질문하기</span><span style="background:var(--C)">C 확인하기</span><span style="background:var(--T)">T 실천하기</span></div>
  <button id="startBtn" type="button" disabled>불러오는 중…</button>
  <button id="restartBtn" type="button" hidden>처음부터</button>
  <small id="cvC"></small>
</div></div>
<div id="loading">불러오는 중…</div>
<div id="top" class="hud"><div id="zoneChip"></div><div class="sp"></div>
  <div id="badges"><span class="lbl">탐험 배지</span> <b id="badgeN">0</b>/3 <span class="badge" data-k="A">A</span><span class="badge" data-k="C">C</span><span class="badge" data-k="T">T</span></div>
  <button id="sndBtn" type="button">소리 켜짐</button><button id="menuBtn" type="button">처음부터</button></div>
<div id="bottom" class="hud"><div id="hint"></div><button id="guideBtn" type="button">길 안내</button></div>
<div id="help"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="stick"><i></i></div>
<section id="card" hidden role="dialog" aria-live="polite"></section>
<script>window.THINK_ASSETS = { lini: '../plaza/assets/rini-lite.glb' };</script>
<script src="kids.config.js?v=1.0"></script>
<script>
  (function () { var C = window.KIDS_CONFIG, $ = function (i) { return document.getElementById(i); };
    $('cvK').textContent = C.kicker; $('cvT').textContent = C.title; $('cvP').textContent = C.coverText; $('cvC').textContent = C.credit; document.title = C.title; })();
</script>
<script type="module" src="think.js?v=1.0"></script>
</body>
</html>
