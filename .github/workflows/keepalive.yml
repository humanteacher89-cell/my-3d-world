# 중계 서버가 잠들지 않게 10분마다 /health 를 두드린다 (GitHub Actions, 공개 저장소는 무료)
# 주소는 france/relay.json 의 "health" 값. 비어 있으면 아무것도 하지 않는다.
name: keep relay awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ping /health
        run: |
          url=$(python3 -c "import json;print(json.load(open('france/relay.json')).get('health',''))")
          if [ -z "$url" ]; then echo "relay.json에 health 주소가 없어 건너뜀"; exit 0; fi
          curl -fsS --max-time 90 "$url" || echo "응답 없음(깨우는 중일 수 있음)"
