<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>융합 광장 · 시범</title>
<style>
  :root { --ink:#22263a; --dim:#646a80; --paper:#fbfaf6; }
  html, body { margin:0; height:100%; overflow:hidden; background:#c9d3dc; font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif; color:var(--ink); }
  canvas { display:block; touch-action:none; }
  #cover { position:fixed; inset:0; display:grid; place-items:center; z-index:5; padding:16px; box-sizing:border-box;
    background:linear-gradient(rgba(201,214,226,.55),rgba(240,236,226,.85)), url(assets/cover.jpg) center/cover no-repeat, #d9dfe4; }
  #cover .card { box-sizing:border-box; background:var(--paper); border-radius:22px; padding:28px 26px 24px; max-width:440px; width:100%; box-shadow:0 18px 50px rgba(30,40,60,.2); text-align:center; }
  #cover .kicker { color:#4f7fae; font-weight:700; font-size:14px; }
  #cover h1 { margin:6px 0 10px; font-size:30px; }
  #cover p { margin:0 0 18px; color:var(--dim); font-size:15px; line-height:1.6; }
  #cover button { display:block; width:100%; border:0; border-radius:14px; padding:15px 12px; font:inherit; font-size:18px; font-weight:700; cursor:pointer; margin-top:10px; }
  #vrBtn { background:#6fb6e8; color:#0c2236; }
  #vrBtn[disabled] { background:#e4e6ea; color:#9298a6; cursor:default; }
  #flatBtn { background:#ebe7de; color:var(--ink); }
  #note { margin-top:12px; font-size:13px; color:var(--dim); min-height:1em; }
  #credit { margin-top:10px; font-size:11px; color:#9298a6; line-height:1.5; }
  #loading { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:rgba(25,30,46,.8); color:#fff; padding:8px 14px; border-radius:20px; font-size:13px; z-index:6; }
  #help { position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top,0px)); transform:translateX(-50%); background:rgba(25,30,46,.72); color:#fff; padding:9px 16px; border-radius:18px; font-size:14px; z-index:4; transition:opacity .8s; width:max-content; max-width:calc(100vw - 32px); box-sizing:border-box; text-align:center; line-height:1.4; display:none; }
  #stick { position:fixed; left:calc(22px + env(safe-area-inset-left,0px)); bottom:calc(22px + env(safe-area-inset-bottom,0px)); width:124px; height:124px; border-radius:50%;
    background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.55); z-index:4; display:none; touch-action:none; }
  #stick i { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:rgba(255,255,255,.75); box-shadow:0 2px 8px rgba(0,0,0,.25); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="cover">
  <div class="card">
    <div class="kicker">휴먼쌤 월드 · 시범</div>
    <h1>융합 광장</h1>
    <p>왼쪽은 학교 교정, 오른쪽은 가상 구역이에요. 가운데 고리는 두 세계를 잇는 문이에요. 걸어 다니며 둘러보고, 리니에게 말을 걸어 보세요.<br>휴대폰·PC 화면으로 보거나 VR 기기로 들어갈 수 있어요.</p>
    <button id="vrBtn" type="button" disabled>VR 확인 중…</button>
    <button id="flatBtn" type="button" disabled>불러오는 중…</button>
    <div id="note"></div>
    <div id="credit">광장은 블렌더로 짓고 그림자·반사광을 미리 구워 넣었어요. 리니는 Tripo로 제작. 글은 모두 확인 전 초안이에요.</div>
  </div>
</div>
<div id="loading">불러오는 중…</div>
<div id="help"></div>
<div id="stick"><i></i></div>
<script type="module" src="plaza.js"></script>
</body>
</html>
