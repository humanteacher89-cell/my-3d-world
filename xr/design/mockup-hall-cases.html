<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>수업 사례관 안 — 관 내부 시안</title>
<!-- 가상융합교육 지도 '수업 사례관' 내부 그림 시안(2026-10-07, XR개발부). 조작은 없다. 정해지면 프랑스 로비 room.js 꼴로 다시 만든다.
     한 장에 세 칸(① 칠판에서 교과 고르기 → ② 고른 교과에 맞게 바뀐 교실 → ③ 책·TV·사진첩으로 보기)과 끝(사례가 들어갈 빈 자리)을 나란히 그렸다.
     같은 방문자 한 사람이 왼쪽 입구에서 오른쪽으로 걸어가는 모습. 캡처는 mockup-hall-concept.html과 같다(헤드리스 Chrome, ?w=&h= 로 크기 지정). -->
<style>
  html, body { margin: 0; height: 100%; background: #0b1035; overflow: hidden; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
  canvas { display: block; }
  #frame { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  #ui { position: absolute; z-index: 2; left: 14px; top: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; max-width: calc(100% - 28px); }
  .pill { max-width: 100%; box-sizing: border-box; background: rgba(10, 14, 40, .74); border: 1px solid rgba(255, 200, 87, .7); color: #fff6df; border-radius: 999px; padding: 8px 14px; font-weight: 900; font-size: 15px; letter-spacing: -.2px; box-shadow: 0 0 18px rgba(255, 200, 87, .28); }
  .tag { background: rgba(255, 200, 87, .15); border-color: rgba(255, 200, 87, .6); color: #ffe6ab; font-weight: 700; font-size: 13px; }
  #leg { position: absolute; z-index: 2; right: 14px; bottom: 14px; background: rgba(10, 14, 40, .74); border: 1px solid rgba(255, 200, 87, .38); border-radius: 14px; padding: 10px 12px; color: #fff3d6; font-size: 12px; line-height: 1.55; pointer-events: none; max-width: calc(100% - 28px); }
  #leg b { color: #fff; }
  @media (max-width: 480px) { .pill { font-size: 13px; padding: 7px 11px; } #leg { font-size: 11px; } }
</style>
</head>
<body>
<div id="frame">
<div id="ui"><div class="pill">수업 사례관 안</div><div class="pill tag">관 내부 시안 · 교과를 고르면 바뀌는 교실</div></div>
<div id="leg"><b>입구(왼쪽)</b>에서 오른쪽으로 · <b>① 칠판에서 교과 고르기</b> → <b>② 고른 교과(예: 과학)에 맞게 교실 꾸밈이 바뀜</b>(반투명 보라 = 바뀌기 전·다른 교과 꾸밈) → <b>③ 책·TV·사진첩으로 사례 보기</b> · 끝에 사례가 들어갈 빈 자리<br>한 사람이 걸어가는 모습을 한 장에 나란히 그림 · 글·뜻풀이는 모두 가안 [확인 전]</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(function () {
  const Q = new URLSearchParams(location.search);
  const FONT = '"Noto Sans KR","Malgun Gothic",sans-serif';
  // ?w=390&h=844 → 창 크기와 상관없이 그 크기로 그린다(헤드리스 캡처는 창 너비가 약 500 아래로 안 줄어든다)
  const FW = +Q.get('w') || 0, FH = +Q.get('h') || 0;
  const W = () => FW || innerWidth, H = () => FH || innerHeight;
  const frame = document.getElementById('frame');
  if (FW && FH) { frame.style.width = FW + 'px'; frame.style.height = FH + 'px'; }
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W(), H());
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  frame.insertBefore(renderer.domElement, frame.firstChild);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, W() / H(), 0.1, 1200);

  // ── 도우미(mockup-hall-concept.html과 같음) ──
  const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; };
  const std = (color, o) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .85, metalness: 0 }, o || {}));
  const glow = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity: opacity == null ? 1 : opacity, blending: THREE.AdditiveBlending, depthWrite: false });
  // 바로 장면에 넣는다(묶음에 g.add 하면 거기로 옮겨 간다)
  function mesh(geo, mat, x, y, z, cast) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (cast !== false) { m.castShadow = true; m.receiveShadow = true; } scene.add(m); return m; }
  function edges(geo, color, x, y, z, op) { const l = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), new THREE.LineBasicMaterial({ color, transparent: true, opacity: op == null ? .95 : op })); l.position.set(x, y, z); return l; }
  function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; };
  let SEED = 23; const rnd = () => (SEED = SEED * 16807 % 2147483647) / 2147483647;
  const NEON = 0x6fe9ff, MINT = 0x7dffd1, GOLD = 0xffd36b, ACC = 0xffc857;
  const C_ACC = '#ffc857', C_MINT = '#7dffd1', C_GHOST = '#a9b4ff';

  // ── 방 치수: 가로 34(x -17~17), 깊이 12(z -6~6), 벽 높이 4.4. 교실 한 칸 ──
  const X0 = -17, XE = 17, ZB = -6, ZF = 6, WH = 4.4, RW = XE - X0, RD = ZF - ZB, PADZ = 4.3;
  // 칸 자리(x): 칠판 -12.3 · 바뀌는 교실 -3.1 · 보기 셋 5.0 / 8.6 / 12.2 · 끝 15.6
  const BX = -12.3, SX = -3.1, TX1 = 5.0, TX2 = 8.6, TX3 = 12.2, EX = 15.6;

  // ── 바깥: 밤하늘(아래쪽까지 별) + 성운 ──
  const skyTex = canvasTex(4, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#05071f'); gr.addColorStop(.45, '#1a1a52'); gr.addColorStop(.6, '#2a1f63'); gr.addColorStop(.8, '#120f3d'); gr.addColorStop(1, '#070a26'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(600, 32, 24), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide })));
  (function stars() {
    const n = 2600, p = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { const a = rnd() * Math.PI * 2, e = Math.acos(rnd() * 2 - 1), r = 540; p[i * 3] = r * Math.sin(e) * Math.cos(a); p[i * 3 + 1] = r * Math.cos(e); p[i * 3 + 2] = r * Math.sin(e) * Math.sin(a); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 2.0, sizeAttenuation: false, transparent: true, opacity: .8 })));
  })();
  const nebTex = canvasTex(512, 256, (g, w, h) => { g.clearRect(0, 0, w, h); [[.22, .5, .3, '150,90,255'], [.5, .42, .34, '255,150,200'], [.78, .56, .3, '255,190,90'], [.42, .66, .22, '120,200,255']].forEach(([fx, fy, fr, c]) => { const gr = g.createRadialGradient(fx * w, fy * h, 4, fx * w, fy * h, fr * w); gr.addColorStop(0, 'rgba(' + c + ',.5)'); gr.addColorStop(1, 'rgba(' + c + ',0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }); });
  const NEBS = [];
  [[34, -30, -60, 110], [-30, -40, -70, 90], [10, -70, 40, 120]].forEach(([x, y, z, s]) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s / 2), new THREE.MeshBasicMaterial({ map: nebTex, transparent: true, opacity: .75, blending: THREE.AdditiveBlending, depthWrite: false })); m.position.set(x, y, z); scene.add(m); NEBS.push(m); });

  // ── 빛 ──
  scene.add(new THREE.HemisphereLight(0xcfdcff, 0x3a2b24, .8));
  const sun = new THREE.DirectionalLight(0xffe7c4, 1.05); sun.position.set(-16, 28, 18); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); { const sc = sun.shadow.camera; sc.left = -26; sc.right = 26; sc.top = 20; sc.bottom = -20; sc.near = 1; sc.far = 90; } sun.shadow.bias = -0.0005; scene.add(sun);
  [[0xffc58a, .7, 16, -14, 4, 1.5], [0xffc857, .9, 14, -11, 3.4, -3], [0x39e0ff, 1.5, 13, -3.2, 2.8, -1], [0xfff1cf, 1.0, 17, 8.6, 4, -2], [0xc4b5fd, .8, 11, 15.5, 3, -2]].forEach(([c, i, d, x, y, z]) => { const l = new THREE.PointLight(c, i, d, 1.6); l.position.set(x, y, z); scene.add(l); });

  // ── 이름표(스프라이트). 큰 번호표 ──
  function label(title, sub, color, x, y, z, scale) {
    const t = canvasTex(1280, 440, (g, w, h) => {
      g.clearRect(0, 0, w, h); rrect(g, 20, 20, w - 40, h - 40, 88); g.fillStyle = 'rgba(8,12,40,.8)'; g.fill(); g.lineWidth = 12; g.strokeStyle = color; g.shadowColor = color; g.shadowBlur = 48; g.stroke(); g.shadowBlur = 0;
      const fit = (txt, weight, size) => { for (; size > 36; size -= 4) { g.font = weight + ' ' + size + 'px ' + FONT; if (g.measureText(txt).width <= w - 140) break; } };
      g.fillStyle = '#ffffff'; g.textAlign = 'center'; g.textBaseline = 'middle'; fit(title, '900', 124); g.fillText(title, w / 2, sub ? 164 : 220);
      if (sub) { g.fillStyle = 'rgba(220,240,255,.94)'; fit(sub, '600', 74); g.fillText(sub, w / 2, 306); }
    });
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, depthTest: false }));
    const k = scale || 1; s.scale.set(9.6 * k, 3.3 * k, 1); s.position.set(x, y, z); s.renderOrder = 10; scene.add(s); return s;
  }
  // 작은 이름표(가로 wu 월드 단위). 짧은 글이라 글자가 크게 보인다
  function plate(title, sub, color, x, y, z, wu, o) {
    o = o || {};
    const cw = 800, ch = Math.round(cw * (sub ? .375 : .26));
    const t = canvasTex(cw, ch, (g, w, h) => {
      g.clearRect(0, 0, w, h); rrect(g, 10, 10, w - 20, h - 20, h * .3); g.fillStyle = o.bg || 'rgba(8,12,40,.86)'; g.fill();
      g.lineWidth = 8; g.strokeStyle = color; g.shadowColor = color; g.shadowBlur = 26; g.stroke(); g.shadowBlur = 0;
      const fit = (txt, weight, size) => { for (; size > 24; size -= 4) { g.font = weight + ' ' + size + 'px ' + FONT; if (g.measureText(txt).width <= w - 70) break; } };
      g.fillStyle = o.fg || '#ffffff'; g.textAlign = 'center'; g.textBaseline = 'middle'; fit(title, '900', o.ts || 112); g.fillText(title, w / 2, sub ? h * .36 : h / 2);
      if (sub) { g.fillStyle = o.sc || 'rgba(220,240,255,.95)'; fit(sub, '600', o.ss || 66); g.fillText(sub, w / 2, h * .74); }
    });
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, depthTest: false }));
    s.scale.set(wu, wu * ch / cw, 1); s.position.set(x, y, z); s.renderOrder = 11; scene.add(s); return s;
  }

  // ── 바닥 판(떠 있는 모형) + 나무 마루 ──
  mesh(new THREE.BoxGeometry(RW, .8, RD), std(0x2b2442, { roughness: .7 }), 0, -.4, 0);
  mesh(new THREE.BoxGeometry(RW, .12, RD + .06), std(0x8a5f3a), 0, -.06, 0);
  function planks(g, x0, w, h, ppu) {
    const rowH = Math.round(.55 * ppu);
    for (let y = 0; y < h; y += rowH) {
      let x = x0 - rnd() * 2 * ppu;
      while (x < x0 + w) {
        const len = (1.6 + rnd() * 2.2) * ppu, c = 178 + Math.floor(rnd() * 38);
        g.fillStyle = 'rgb(' + (c + 18) + ',' + (Math.floor(c * .7) + 8) + ',' + Math.floor(c * .44) + ')'; g.fillRect(x + 1, y + 1, len - 2, rowH - 2);
        g.strokeStyle = 'rgba(90,55,25,.16)'; g.lineWidth = 1.5;
        for (let k = 0; k < 3; k++) { const yy = y + 5 + rnd() * (rowH - 10); g.beginPath(); g.moveTo(x + 4, yy); g.bezierCurveTo(x + len * .3, yy + 3, x + len * .6, yy - 3, x + len - 4, yy); g.stroke(); }
        x += len;
      }
    }
  }
  const woodTex = canvasTex(2176, 768, (g, w, h) => { g.fillStyle = '#6b4526'; g.fillRect(0, 0, w, h); planks(g, 0, w, h, 64); });
  const wood = mesh(new THREE.PlaneGeometry(RW, RD), std(0xffffff, { map: woodTex, roughness: .8 }), 0, .01, 0, false); wood.rotation.x = -Math.PI / 2; wood.receiveShadow = true;

  // ── 벽: 왼쪽(입구)·뒤·오른쪽. 앞(남쪽)은 열어 둔다 ──
  const wallTex = canvasTex(64, 256, (g, w, h) => { g.fillStyle = '#f1e4cc'; g.fillRect(0, 0, w, h); g.fillStyle = '#a8794d'; g.fillRect(0, h * .76, w, h * .24); g.fillStyle = '#8a5f3a'; g.fillRect(0, h * .755, w, 5); });
  const WALL = std(0xffffff, { map: wallTex });
  mesh(new THREE.BoxGeometry(.3, WH, RD), WALL, X0 - .15, WH / 2, 0);
  mesh(new THREE.BoxGeometry(RW + .6, WH, .3), WALL, 0, WH / 2, ZB - .15);
  mesh(new THREE.BoxGeometry(.3, WH, RD), WALL, XE + .15, WH / 2, 0);

  // ── 입구: 문 + '지도로' 발판 + 리니 ──
  const doorTex = canvasTex(256, 352, (g, w, h) => { g.fillStyle = '#9a6b42'; g.fillRect(0, 0, w, h); g.strokeStyle = '#6b4526'; g.lineWidth = 10; g.strokeRect(28, 30, w - 56, 120); g.strokeRect(28, 190, w - 56, 130); g.fillStyle = '#bfe6ff'; g.fillRect(48, 48, w - 96, 84); g.fillStyle = '#f5d76e'; g.beginPath(); g.arc(w - 46, 180, 12, 0, Math.PI * 2); g.fill(); });
  const door = mesh(new THREE.PlaneGeometry(1.9, 2.6), std(0xffffff, { map: doorTex }), X0 + .01, 1.3, PADZ - .2, false); door.rotation.y = Math.PI / 2;
  const matTex = canvasTex(512, 256, (g, w, h) => { rrect(g, 8, 8, w - 16, h - 16, 40); g.fillStyle = 'rgba(14,20,52,.78)'; g.fill(); g.lineWidth = 10; g.strokeStyle = '#ffd36b'; g.stroke(); g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '900 92px ' + FONT; g.fillText('지도로', w / 2, h / 2); });
  const mapMat = new THREE.Mesh(new THREE.PlaneGeometry(1.8, .9), new THREE.MeshBasicMaterial({ map: matTex, transparent: true, depthWrite: false })); mapMat.rotation.x = -Math.PI / 2; mapMat.position.set(X0 + 1.1, .05, PADZ - .2); mapMat.renderOrder = 3; scene.add(mapMat);
  (function rini() { const g = new THREE.Group(); g.position.set(X0 + 1.9, 0, 1.3); g.rotation.y = .4; g.add(mesh(new THREE.BoxGeometry(.9, 1.0, .7), std(0xfaf6ea), 0, .9, 0)); g.add(mesh(new THREE.BoxGeometry(1.1, .9, .9), std(0xfaf6ea), 0, 1.95, 0)); g.add(mesh(new THREE.BoxGeometry(.85, .5, .05), new THREE.MeshStandardMaterial({ color: 0x1a2a4a, emissive: 0x3fb8ff, emissiveIntensity: .6 }), 0, 1.95, .47)); g.add(new THREE.Mesh(new THREE.SphereGeometry(.14, 8, 6), glow(MINT, 1)).translateY(2.65)); g.add(mesh(new THREE.BoxGeometry(.5, .7, .3), std(0xffd36b), 0, .9, -.5)); scene.add(g); })();

  // ── ① 칠판: 교과 버튼 6개 중 '과학'이 켜져 있다 ──
  const BW = 7.8, BH = 2.9, BY = 2.62;
  const SUBJ = [['국어', 0, 0], ['수학', 1, 0], ['과학', 2, 0], ['사회', 0, 1], ['영어', 1, 1], ['예체능', 2, 1]];
  const CH = { w: 440, h: 170, gx: 40, gy: 34, x0: 80, y0: 150 };
  const boardTex = canvasTex(1560, 580, (g, w, h) => {
    g.fillStyle = '#2f5a46'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 46; i++) { g.fillStyle = 'rgba(255,255,255,' + (.02 + rnd() * .03) + ')'; g.fillRect(rnd() * w, rnd() * h, 60 + rnd() * 160, 10 + rnd() * 30); }
    g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = 'rgba(255,255,255,.95)'; g.font = '900 80px ' + FONT; g.fillText('교과를 골라 보세요', 80, 76);
    g.setLineDash([16, 12]); g.lineWidth = 5; g.strokeStyle = 'rgba(255,255,255,.7)'; rrect(g, w - 260, 36, 180, 78, 36); g.stroke(); g.setLineDash([]);
    g.textAlign = 'center'; g.font = '800 44px ' + FONT; g.fillStyle = 'rgba(255,255,255,.85)'; g.fillText('예시', w - 170, 76);
    SUBJ.forEach(([name, c, r]) => {
      const x = CH.x0 + c * (CH.w + CH.gx), y = CH.y0 + r * (CH.h + CH.gy), on = name === '과학';
      rrect(g, x, y, CH.w, CH.h, 44);
      if (on) { g.shadowColor = '#ffc857'; g.shadowBlur = 50; g.fillStyle = '#ffc857'; g.fill(); g.shadowBlur = 0; g.lineWidth = 8; g.strokeStyle = '#fff3c8'; g.stroke(); }
      else { g.fillStyle = 'rgba(255,255,255,.07)'; g.fill(); g.lineWidth = 6; g.strokeStyle = 'rgba(255,255,255,.62)'; g.stroke(); }
      g.fillStyle = on ? '#3a2600' : 'rgba(255,255,255,.92)'; g.font = '900 90px ' + FONT; g.textAlign = 'center'; g.fillText(name, x + CH.w / 2, y + CH.h / 2 + 4);
      if (on) { // 눌린 손가락(화살표) 표시
        g.save(); g.translate(x + CH.w - 118, y + CH.h - 64); g.fillStyle = '#ffffff'; g.strokeStyle = '#2a1d00'; g.lineWidth = 7; g.lineJoin = 'round';
        g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 100); g.lineTo(26, 76); g.lineTo(46, 118); g.lineTo(66, 108); g.lineTo(46, 68); g.lineTo(80, 68); g.closePath(); g.fill(); g.stroke(); g.restore();
      }
    });
  });
  mesh(new THREE.BoxGeometry(BW + .3, BH + .3, .1), std(0x8a5f3a), BX, BY, ZB + .05);
  mesh(new THREE.PlaneGeometry(BW, BH), new THREE.MeshBasicMaterial({ map: boardTex }), BX, BY, ZB + .11, false);
  mesh(new THREE.BoxGeometry(BW * .66, .08, .22), std(0x8a5f3a), BX, BY - BH / 2 - .12, ZB + .2);
  [[-1.0, 0xffffff], [-.7, 0xffe08a], [-.4, 0xffb4c8]].forEach(([dx, c]) => { const ck = mesh(new THREE.CylinderGeometry(.03, .03, .2, 8), std(c), BX + dx, BY - BH / 2 - .04, ZB + .22); ck.rotation.z = Math.PI / 2; });
  // 러그(프랑스 한글학교 교실처럼 칠판 앞에, ㄱㄴㄷ)
  const rugTex = canvasTex(512, 256, (g, w, h) => {
    g.fillStyle = '#5ea878'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 10; g.strokeRect(18, 18, w - 36, h - 36);
    g.fillStyle = 'rgba(255,255,255,.97)'; g.font = '900 100px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle';
    [['ㄱ', .1, .3], ['ㄴ', .1, .72], ['ㄷ', .9, .3], ['ㄹ', .9, .72]].forEach(([ch, fx, fy]) => g.fillText(ch, w * fx, h * fy));
