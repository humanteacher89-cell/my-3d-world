<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>안전·윤리 등대 안 — 관 내부 시안</title>
<!-- 가상융합교육 지도 '안전·윤리 등대' 내부 그림 시안(2026-10-07, XR개발부). 조작은 없다. 정해지면 프랑스 로비 room.js 꼴로 다시 만든다.
     등대 한쪽 벽을 잘라 낸 단면: 아래 입구('지도로' 발판·리니·체크리스트) → 나선 계단 → 1~4층(상황 카드 + 등불) → 꼭대기 등실(큰 등).
     1·2층 등불은 켜짐, 3층에서 고르는 중, 4층과 큰 등은 꺼짐. 캡처는 mockup-hall-concept.html과 같다(?w=&h= 처리 포함). -->
<style>
  html, body { margin: 0; height: 100%; background: #0b1035; overflow: hidden; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
  canvas { display: block; }
  #frame { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  #ui { position: absolute; z-index: 2; left: 14px; top: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; max-width: calc(100% - 28px); }
  .pill { max-width: 100%; box-sizing: border-box; background: rgba(10, 14, 40, .74); border: 1px solid rgba(255, 243, 168, .6); color: #fffbe0; border-radius: 999px; padding: 8px 14px; font-weight: 900; font-size: 15px; letter-spacing: -.2px; box-shadow: 0 0 18px rgba(255, 243, 168, .25); }
  .tag { background: rgba(255, 243, 168, .14); border-color: rgba(255, 243, 168, .55); color: #fff6c4; font-weight: 700; font-size: 13px; }
  #leg { position: absolute; z-index: 2; right: 14px; bottom: 14px; background: rgba(10, 14, 40, .74); border: 1px solid rgba(255, 243, 168, .4); border-radius: 14px; padding: 10px 12px; color: #e8f1ff; font-size: 12px; line-height: 1.55; pointer-events: none; max-width: min(460px, calc(100% - 28px)); }
  #leg b { color: #fff; }
  @media (max-width: 480px) { .pill { font-size: 13px; padding: 7px 11px; } #leg { font-size: 11px; } }
</style>
</head>
<body>
<div id="frame">
<div id="ui"><div class="pill">안전·윤리 등대 안</div><div class="pill tag">관 내부 시안 · 불을 켜는 등대</div></div>
<div id="leg"><b>입구(왼쪽 아래)</b>에서 계단을 올라 <b>층마다 상황 하나</b>를 고릅니다<br>맞게 고르면 <b>그 층 등불이 켜지고</b>, 넷 다 켜지면 섬 전체가 환해집니다<br>지금 1·2층은 켜짐, 3층에서 고르는 중 · 끝: 안전 수업 체크리스트<br>글·뜻풀이는 모두 가안 [확인 전]</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(function () {
  const Q = new URLSearchParams(location.search);
  const FONT = '"Noto Sans KR","Malgun Gothic",sans-serif';
  // ?w=390&h=844 → 창 크기와 상관없이 그 크기로 그린다(헤드리스 캡처는 창 너비가 약 500 아래로 안 줄어든다)
  const FW = +Q.get('w') || 0, FH = +Q.get('h') || 0;
  const W = () => FW || innerWidth || 1280, H = () => FH || innerHeight || 720;
  const frame = document.getElementById('frame');
  if (FW && FH) { frame.style.width = FW + 'px'; frame.style.height = FH + 'px'; }
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W(), H());
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  frame.insertBefore(renderer.domElement, frame.firstChild);

  const scene = new THREE.Scene();
  // 탑이 세로로 길어서 원근이 거의 없는 좁은 화각(14도)으로 멀리서 본다 → 층마다 내려다보는 각도가 비슷하다
  const camera = new THREE.PerspectiveCamera(14, W() / H(), 1, 1500);

  // ── 도우미(개념관 그림과 같음) ──
  const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; };
  const std = (color, o) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .85, metalness: 0 }, o || {}));
  const glow = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity: opacity == null ? 1 : opacity, blending: THREE.AdditiveBlending, depthWrite: false });
  function mesh(geo, mat, x, y, z, cast) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (cast !== false) { m.castShadow = true; m.receiveShadow = true; } scene.add(m); return m; }
  function edges(geo, color, x, y, z, op) { const l = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), new THREE.LineBasicMaterial({ color, transparent: true, opacity: op == null ? .95 : op })); l.position.set(x, y, z); return l; }
  function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; };
  let SEED = 7; const rnd = () => (SEED = SEED * 16807 % 2147483647) / 2147483647;
  const ACC = 0xfff3a8, ACC_S = '#fff3a8', LIT = 0xffd36b, LIT_S = '#ffd36b', NEON = 0x6fe9ff, MINT = 0x7dffd1;
  // 글자 판(스프라이트): 항상 카메라를 보고, 건물에 가려지지 않는다
  function sprite(tex, w, h, x, y, z, order) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false })); s.scale.set(w, h, 1); s.position.set(x, y, z); s.renderOrder = order || 10; scene.add(s); return s; }
  const glowTex = canvasTex(128, 128, (g, w, h) => { const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); gr.addColorStop(0, 'rgba(255,240,180,1)'); gr.addColorStop(.3, 'rgba(255,205,100,.55)'); gr.addColorStop(1, 'rgba(255,170,60,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  function halo(x, y, z, size, op, tex) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex || glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: op == null ? 1 : op })); s.scale.set(size, size, 1); s.position.set(x, y, z); scene.add(s); return s; }
  // 전구 그림(이름표 왼쪽): on = 켜짐(노랑), off = 꺼짐(윤곽만)
  function bulb(g, cx, cy, on) {
    if (on) { const gr = g.createRadialGradient(cx, cy, 6, cx, cy, 92); gr.addColorStop(0, 'rgba(255,225,120,.9)'); gr.addColorStop(1, 'rgba(255,200,80,0)'); g.fillStyle = gr; g.fillRect(cx - 100, cy - 100, 200, 200); }
    g.beginPath(); g.arc(cx, cy - 6, 40, 0, Math.PI * 2); g.fillStyle = on ? '#ffe27a' : 'rgba(40,48,86,.9)'; g.fill(); g.lineWidth = 8; g.strokeStyle = on ? '#fff6c4' : 'rgba(170,180,220,.75)'; g.stroke();
    rrect(g, cx - 20, cy + 32, 40, 24, 8); g.fillStyle = on ? '#e9d8a0' : 'rgba(120,128,168,.8)'; g.fill();
    if (on) { g.strokeStyle = '#fff1b0'; g.lineWidth = 7; g.lineCap = 'round'; for (let i = 0; i < 7; i++) { const a = -Math.PI * .95 + i * (Math.PI * .9 / 6); g.beginPath(); g.moveTo(cx + Math.cos(a) * 58, cy - 6 + Math.sin(a) * 58); g.lineTo(cx + Math.cos(a) * 76, cy - 6 + Math.sin(a) * 76); g.stroke(); } }
  }
  // 이름표(큰 글 + 한 줄 설명). opt.bulb = 'on' | 'off'
  function label(title, sub, color, x, y, z, k, opt) {
    const bl = opt && opt.bulb;
    const t = canvasTex(1280, 440, (g, w, h) => {
      g.clearRect(0, 0, w, h); rrect(g, 20, 20, w - 40, h - 40, 88); g.fillStyle = 'rgba(8,12,40,.84)'; g.fill(); g.lineWidth = 12; g.strokeStyle = color; g.shadowColor = color; g.shadowBlur = 48; g.stroke(); g.shadowBlur = 0;
      const x0 = bl ? 200 : 70, tw = w - x0 - 70, cx = x0 + tw / 2;
      const fit = (txt, weight, size) => { for (; size > 36; size -= 4) { g.font = weight + ' ' + size + 'px ' + FONT; if (g.measureText(txt).width <= tw) break; } };
      g.fillStyle = '#ffffff'; g.textAlign = 'center'; g.textBaseline = 'middle'; fit(title, '900', 112); g.fillText(title, cx, sub ? 160 : 220);
      if (sub) { g.fillStyle = 'rgba(225,240,255,.95)'; fit(sub, '600', 70); g.fillText(sub, cx, 300); }
      if (bl) bulb(g, 112, h / 2, bl === 'on');
    });
    const kk = k || 1; return sprite(t, 9.6 * kk, 3.3 * kk, x, y, z, 10);
  }
  // 작은 알약 이름표
  function chip(text, color, x, y, z, w, fs) {
    const t = canvasTex(1000, 220, (g, cw, ch) => {
      g.clearRect(0, 0, cw, ch); rrect(g, 10, 10, cw - 20, ch - 20, 100); g.fillStyle = 'rgba(8,12,40,.86)'; g.fill(); g.lineWidth = 9; g.strokeStyle = color; g.shadowColor = color; g.shadowBlur = 26; g.stroke(); g.shadowBlur = 0;
      g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
      for (let s = fs || 110; s > 40; s -= 4) { g.font = '800 ' + s + 'px ' + FONT; if (g.measureText(text).width <= cw - 120) break; }
      g.fillText(text, cw / 2, ch / 2 + 4);
    });
    return sprite(t, w, w * .22, x, y, z, 11);
  }

  // ── 치수: 탑 바깥 반지름 9(아래)→7.5(위), 벽 두께 .55, 층 높이 4.4, 꼭대기 등실 바닥 22 ──
  const FL = [0, 4.4, 8.8, 13.2, 17.6], LY = 22.0, TH = .4, RISE = 4.4 / 12, NSTEP = 58;
  const Ro = y => 9.0 - .07 * y, TW = .55, Ri = y => Ro(y) - TW;
  const ALPHA = 62 * Math.PI / 180;           // 벽이 앞쪽으로 이 각도까지 감겨 와서 끝난다(잘라 낸 입구)
  const zF = y => Ri(y) * Math.cos(ALPHA);    // 바닥판 앞쪽 가장자리(z)
  const HOLE = 3.0;                           // 계단 구멍 반지름

  // ── 바깥: 밤하늘(카메라가 수평선 근처를 보니 보랏빛 노을띠를 아래쪽에 둔다) + 달 + 성운 ──
  const skyTex = canvasTex(4, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); [[0, '#04061c'], [.35, '#080c32'], [.5, '#17154a'], [.6, '#2a2068'], [.72, '#151045'], [.86, '#0a0b2e'], [1, '#070a26']].forEach(([p, c]) => gr.addColorStop(p, c)); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(900, 32, 24), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false })));
  // 카메라가 보는 방향으로 하늘에 얹는 점(별·성운·달)의 자리: 화면 좌표(-1~1) → 하늘 구 위 한 점
  const refCam = new THREE.PerspectiveCamera(14, 16 / 9, 1, 1500);   // 창 크기와 상관없이 16:9 화면 기준으로 별·달 자리를 잡는다
  function skyPoint(nx, ny, r) {
    const C = refCam.position.clone(), d = new THREE.Vector3(nx, ny, .5).unproject(refCam).sub(C).normalize();
    const b = C.dot(d), c = C.lengthSq() - r * r, t = -b + Math.sqrt(b * b - c); return C.add(d.multiplyScalar(t));
  }
  const LATE = [];   // 카메라를 맞춘 뒤에 놓는 것들
  LATE.push(function stars() {
    const n = 1500, p = new Float32Array(n * 3), col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { const v = skyPoint(rnd() * 2.1 - 1.05, rnd() * 2.1 - 1.05, 800); p[i * 3] = v.x; p[i * 3 + 1] = v.y; p[i * 3 + 2] = v.z; const s = .65 + rnd() * .35, w = rnd(); col[i * 3] = s; col[i * 3 + 1] = s * (.9 + w * .1); col[i * 3 + 2] = s * (.8 + (1 - w) * .2); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 2.0, sizeAttenuation: false, transparent: true, opacity: .9, vertexColors: true, depthWrite: false })));
    const n2 = 34, p2 = new Float32Array(n2 * 3);   // 더 크고 밝은 별 몇 개
    for (let i = 0; i < n2; i++) { const v = skyPoint(rnd() * 2 - 1, rnd() * 2 - 1, 790); p2[i * 3] = v.x; p2[i * 3 + 1] = v.y; p2[i * 3 + 2] = v.z; }
    const g2 = new THREE.BufferGeometry(); g2.setAttribute('position', new THREE.BufferAttribute(p2, 3));
    scene.add(new THREE.Points(g2, new THREE.PointsMaterial({ color: 0xffffff, size: 3.6, sizeAttenuation: false, transparent: true, opacity: .95, depthWrite: false })));
  });
  LATE.push(function nebulae() {
    const nebTex = canvasTex(512, 256, (g, w, h) => { g.clearRect(0, 0, w, h); [[.22, .5, .3, '150,90,255'], [.5, .42, .34, '255,90,200'], [.78, .56, .3, '80,160,255'], [.42, .66, .22, '120,255,220']].forEach(([fx, fy, fr, c]) => { const gr = g.createRadialGradient(fx * w, fy * h, 4, fx * w, fy * h, fr * w); gr.addColorStop(0, 'rgba(' + c + ',.5)'); gr.addColorStop(1, 'rgba(' + c + ',0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }); });
    [[-.82, -.52, 120, .5], [.86, -.62, 140, .45], [-.5, .62, 100, .35], [.45, .3, 90, .25]].forEach(([nx, ny, s, op]) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s / 2), new THREE.MeshBasicMaterial({ map: nebTex, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false })); m.position.copy(skyPoint(nx, ny, 700)); m.lookAt(camera.position); scene.add(m); });
  });
  LATE.push(function moon() {
    const mt = canvasTex(256, 256, (g, w, h) => { const gr = g.createRadialGradient(128, 128, 20, 128, 128, 128); gr.addColorStop(0, 'rgba(255,248,210,.55)'); gr.addColorStop(1, 'rgba(255,248,210,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.beginPath(); g.arc(128, 128, 54, 0, Math.PI * 2); g.fillStyle = '#fff6d0'; g.fill(); g.fillStyle = 'rgba(214,196,150,.55)'; [[108, 112, 14], [146, 140, 18], [124, 150, 9], [150, 104, 8]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }); });
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: mt, transparent: true, depthWrite: false, fog: false })); s.position.copy(skyPoint(.9, .76, 760)); s.scale.set(44, 44, 1); scene.add(s);
  });

  // ── 빛: 달빛(차가움) + 켜진 1·2층 등불(따뜻함). 바닥판은 그림자를 드리우지 않는다(안쪽이 어두워지므로) ──
  scene.add(new THREE.HemisphereLight(0xb7c6ff, 0x30283c, .5));
  const moonL = new THREE.DirectionalLight(0xd6e0ff, .6); moonL.position.set(-18, 40, 40); moonL.castShadow = true;
  moonL.shadow.mapSize.set(2048, 2048); { const sc = moonL.shadow.camera; sc.left = -26; sc.right = 26; sc.top = 30; sc.bottom = -12; sc.near = 1; sc.far = 140; } moonL.shadow.bias = -0.0006; scene.add(moonL);
  // 층마다 안쪽을 조금 밝히는 은은한 보조 빛(꺼진 층은 차갑게, 켜진 층은 따뜻하게는 아래 등불에서)
  FL.forEach((y, i) => { const l = new THREE.PointLight(0x9fb4ff, .4, 12, 1.4); l.position.set(0, y + 3.2, 2.5); scene.add(l); });

  // ── 섬(떠 있는 바위 판): 가로로 긴 타원 ──
  const grassTex = canvasTex(512, 512, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, w / 2); gr.addColorStop(0, '#306f5e'); gr.addColorStop(1, '#1b3f45'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 900; i++) { g.fillStyle = 'rgba(' + Math.floor(120 + rnd() * 60) + ',' + Math.floor(210 + rnd() * 40) + ',' + Math.floor(150 + rnd() * 40) + ',' + (.05 + rnd() * .12) + ')'; g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 4, 6 + rnd() * 10); }
  });
  const rockTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#4c4668'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 14) { g.fillStyle = 'rgba(' + (70 + Math.floor(rnd() * 50)) + ',' + (60 + Math.floor(rnd() * 40)) + ',' + (100 + Math.floor(rnd() * 50)) + ',' + (.25 + rnd() * .3) + ')'; g.fillRect(0, y, w, 6 + rnd() * 8); }
    for (let i = 0; i < 160; i++) { g.fillStyle = 'rgba(20,16,40,' + (.1 + rnd() * .2) + ')'; g.fillRect(rnd() * w, rnd() * h, 3 + rnd() * 10, 2 + rnd() * 6); }
  });
  const isl = new THREE.Group(); isl.scale.set(1.4, 1, .72); scene.add(isl);
  { const top = new THREE.Mesh(new THREE.CylinderGeometry(12.5, 12.2, .5, 72), [std(0xffffff, { map: rockTex, roughness: 1, emissive: 0x7a6cb0, emissiveMap: rockTex, emissiveIntensity: .8 }), std(0xffffff, { map: grassTex, roughness: .95 }), std(0x40384e)]); top.position.y = -.04 - .25; top.receiveShadow = true; isl.add(top);
    const rock = new THREE.Mesh(new THREE.ConeGeometry(12.2, 5.8, 48, 1, true), std(0xffffff, { map: rockTex, roughness: 1, side: THREE.DoubleSide, emissive: 0x7a6cb0, emissiveMap: rockTex, emissiveIntensity: .8 })); rock.rotation.x = Math.PI; rock.position.y = -.54 - 2.9; rock.receiveShadow = true; isl.add(rock);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(12.45, .06, 6, 120), glow(ACC, .55)); rim.rotation.x = Math.PI / 2; rim.position.y = -.03; isl.add(rim); }
  // 섬 위 작은 나무
  function tree(x, z, s) { const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
    g.add(mesh(new THREE.CylinderGeometry(.14 * s, .2 * s, .8 * s, 8), std(0x5a4636), 0, .4 * s, 0));
    [[1.25, 2.2, 1.0], [.95, 1.8, 2.3], [.65, 1.4, 3.3]].forEach(([r, h, y]) => g.add(mesh(new THREE.ConeGeometry(r * s, h * s, 9), std(0x1f5a4c, { roughness: .9 }), 0, y * s - .1, 0)));
    return g; }
  { const coolTex = canvasTex(128, 128, (g, w, h) => { const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); gr.addColorStop(0, 'rgba(120,170,255,.8)'); gr.addColorStop(.5, 'rgba(120,110,255,.3)'); gr.addColorStop(1, 'rgba(100,90,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
    halo(0, -4.2, -2, 52, .32, coolTex); }
  tree(13.0, 3.0, 1.15); tree(15.0, -2.4, 1.35); tree(9.8, 5.6, .95); tree(10.6, -6.0, 1.4); tree(-11.6, -6.0, 1.1);
  // 섬 아래로 부서져 떨어지는 빛 조각

    g.add(mesh(new THREE.BoxGeometry(.85, .5, .05), new THREE.MeshStandardMaterial({ color: 0x1a2a4a, emissive: 0x3fb8ff, emissiveIntensity: .6 }), 0, 1.95, .47));
    g.add(new THREE.Mesh(new THREE.SphereGeometry(.14, 8, 6), glow(MINT, 1)).translateY(2.65)); g.add(mesh(new THREE.BoxGeometry(.5, .7, .3), std(0xffd36b), 0, .9, -.5)); return g; }

  // ── 입구(맨 아래 층, 왼쪽): '지도로' 발판 + 리니 ──
  const ENT = { padX: -4.6, padZ: 1.9, riniX: -10.2, riniZ: 3.0 };
  padRing(ENT.padX, 0, ENT.padZ, 1.45, ACC_S, 'here');
  chip('지도로', ACC_S, ENT.padX + .3, 2.3, ENT.padZ + .5, 3.4);
  rini(ENT.riniX, 0, ENT.riniZ, .5, 1.15);
  label('리니', '한 층씩 올라가 봐요', '#7dffd1', ENT.riniX - .3, 4.9, ENT.riniZ, .62);

  // ── 끝 요소: 입구 옆 '안전 수업 체크리스트' 카드(항목 넷, 체크 표시만 — 1·2는 켜진 층이라 체크, 3·4는 흐린 체크) ──
  { const t = canvasTex(800, 640, (g, w, h) => {
      g.clearRect(0, 0, w, h); rrect(g, 14, 14, w - 28, h - 28, 56); g.fillStyle = 'rgba(8,12,40,.9)'; g.fill(); g.lineWidth = 11; g.strokeStyle = ACC_S; g.shadowColor = ACC_S; g.shadowBlur = 34; g.stroke(); g.shadowBlur = 0;
      g.textBaseline = 'middle'; g.textAlign = 'center'; g.fillStyle = '#fff'; fitFont(g, '안전 수업 체크리스트', '900', w - 120, 64); g.fillText('안전 수업 체크리스트', w / 2, 88);
      g.strokeStyle = 'rgba(255,243,168,.35)'; g.lineWidth = 4; g.beginPath(); g.moveTo(60, 148); g.lineTo(w - 60, 148); g.stroke();
      [['쉬는 때 알기', 1], ['연령 기준 알기', 1], ['사진·정보 지키기', 0], ['예절 지키기', 0]].forEach(([txt, on], i) => {
        const y = 224 + i * 104;
        rrect(g, 64, y - 36, 72, 72, 16); if (on) { g.fillStyle = LIT_S; g.fill(); } else { g.setLineDash([14, 10]); g.lineWidth = 6; g.strokeStyle = 'rgba(255,243,168,.55)'; g.stroke(); g.setLineDash([]); }
        g.strokeStyle = on ? '#2a2108' : 'rgba(255,243,168,.28)'; g.lineWidth = 12; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(80, y + 2); g.lineTo(98, y + 20); g.lineTo(124, y - 18); g.stroke();
        g.fillStyle = on ? '#fff' : 'rgba(230,238,255,.62)'; g.textAlign = 'left'; fitFont(g, txt, '800', w - 220, 60); g.fillText(txt, 164, y + 2);
      });
    });
    sprite(t, 7.4, 5.92, -17.4, 5.2, 0, 12); }

  // ── 3층 선택지 버튼 3개('예:'로 짧게) — 방문자 손에서 점선으로 이어진다 ──
  { const t = canvasTex(1200, 860, (g, w, h) => {
      g.clearRect(0, 0, w, h); rrect(g, 14, 14, w - 28, h - 28, 70); g.fillStyle = 'rgba(8,12,40,.72)'; g.fill(); g.lineWidth = 8; g.strokeStyle = 'rgba(255,243,168,.55)'; g.stroke();
      g.textBaseline = 'middle'; g.textAlign = 'center'; g.fillStyle = ACC_S; g.font = '900 64px ' + FONT; g.fillText('③ 어떻게 할까요?', w / 2, 96);
      ['예: 먼저 친구에게 물어봐요', '예: 그냥 올려요', '예: 이름도 같이 적어요'].forEach((txt, i) => {
        const y = 170 + i * 220;
        rrect(g, 56, y, w - 112, 184, 66); g.fillStyle = 'rgba(22,32,92,.95)'; g.fill(); g.lineWidth = 9; g.strokeStyle = ACC_S; g.shadowColor = ACC_S; g.shadowBlur = 22; g.stroke(); g.shadowBlur = 0;
        g.fillStyle = '#fff'; g.textAlign = 'center'; fitFont(g, txt, '800', w - 220, 76); g.fillText(txt, w / 2, y + 94);
      });
    });
    sprite(t, 9.6, 6.88, -15.4, VY + 2.9, 0, 12); }
  { const S = hand, E = new THREE.Vector3(-10.3, VY + 3.0, .4), C = new THREE.Vector3((S.x + E.x) / 2, Math.max(S.y, E.y) + 2.2, 1.2);
    for (let i = 1; i <= 13; i++) { const u = i / 14, p = new THREE.Vector3().addScaledVector(S, (1 - u) * (1 - u)).addScaledVector(C, 2 * (1 - u) * u).addScaledVector(E, u * u); const d = new THREE.Mesh(new THREE.SphereGeometry(.1, 8, 6), glow(ACC, .4 + .6 * u)); d.material.depthTest = false; d.renderOrder = 13; d.position.copy(p); scene.add(d); } }

  // ── 오른쪽: 층 이름표(켜진 층은 노란 전구, 꺼진 층은 빈 전구) + 꼭대기 등실 이름표 ──
  function leader(x1, x2, y, z) { const m = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x2 - x1), .06, .06), new THREE.MeshBasicMaterial({ color: ACC, transparent: true, opacity: .8 })); m.position.set((x1 + x2) / 2, y, z || .3); scene.add(m); }
  [['① 사용 시간·어지러움', '어지러우면 어떻게 할까요?', 'on'], ['② 연령 기준', '이 체험은 누가 해도 될까요?', 'on'], ['③ 개인정보·초상권', '친구 얼굴 사진, 올려도 될까요?', 'off'], ['④ 가상 공간 예절', '낯선 아바타가 다가오면?', 'off']].forEach(([t, s, b], i) => {
    const y = FL[i + 1] + 2.2; label(t, s, ACC_S, 15.7, y, 0, 1.08, { bulb: b }); leader(10.4, Ro(y) + .1, y);
  });
  label('꼭대기 등실', '넷 다 켜지면 섬 전체를 비춰요', ACC_S, 14.6, LY + 2.7, 0, 1.08, { bulb: 'off' }); leader(9.4, GR + .1, LY + 2.2);

  // ── 카메라: 북쪽이 위, 15도로 살짝 내려다본다(탑 전체가 한 화면) ──
  function fitCamera() {
    const asp = W() / H(), pitch = THREE.MathUtils.degToRad(15);
    let D = 144; if (asp < 1.6) D *= 1.6 / asp;
    const tx = 0, ty = 11.25, tz = 0;
    camera.aspect = asp; camera.updateProjectionMatrix();
    camera.position.set(tx, ty + D * Math.sin(pitch), tz + D * Math.cos(pitch)); camera.lookAt(tx, ty, tz);
    refCam.position.copy(camera.position); refCam.quaternion.copy(camera.quaternion); refCam.aspect = 16 / 9; refCam.updateProjectionMatrix(); refCam.updateMatrixWorld();
  }
  fitCamera();
  LATE.forEach(f => f());
  addEventListener('resize', () => { renderer.setSize(W(), H()); fitCamera(); });

  const t0 = performance.now();
  function tick(now) {
    const t = (now - t0) / 1000;
    const c = renderer.domElement; if (c.width !== Math.floor(W() * renderer.getPixelRatio()) || c.height !== Math.floor(H() * renderer.getPixelRatio())) { renderer.setSize(W(), H()); fitCamera(); }
    DRIFT.forEach((m, i) => { m.rotation.y = i + t * .3; });
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
  window.__mock = { scene, camera, renderer, fitCamera };
})();
