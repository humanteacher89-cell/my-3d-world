<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>미래 전망대 안 — 관 내부 시안</title>
<!-- 가상융합교육 지도 '미래 전망대' 내부 그림 시안(2026-10-07, XR개발부). 조작은 없다. 정해지면 프랑스 로비 room.js 꼴로 다시 만든다.
     탑 꼭대기 유리 전망대 한 장: 입구(왼쪽 엘리베이터 + '지도로' 발판 + 리니) → 망원경 ① ② ③ ④(각각 위에 '보이는 장면' 둥근 창) → 끝 메모판.
     전망대 아래·바깥은 밤의 공존 도시(리니가 사는 메인 월드와 같은 세계). 같은 방문자 한 사람이 입구·망원경·메모판에서 보인다.
     캡처는 mockup-hall-concept.html과 같다(헤드리스 Chrome, 폰 세로는 ?w=390&h=844). -->
<style>
  html, body { margin: 0; height: 100%; background: #0b1035; overflow: hidden; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
  canvas { display: block; }
  #frame { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  #shade { position: absolute; z-index: 1; left: 0; right: 0; top: 0; height: 11%; background: linear-gradient(to bottom, rgba(8, 10, 40, .6), rgba(8, 10, 40, 0)); pointer-events: none; }
  #ui { position: absolute; z-index: 2; left: 14px; top: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; max-width: calc(100% - 28px); }
  .pill { max-width: 100%; box-sizing: border-box; background: rgba(10, 14, 40, .78); border: 1px solid rgba(120, 220, 255, .55); color: #e8f6ff; border-radius: 999px; padding: 8px 14px; font-weight: 900; font-size: 15px; letter-spacing: -.2px; box-shadow: 0 0 18px rgba(80, 200, 255, .25); }
  .tag { background: linear-gradient(rgba(255, 143, 224, .16), rgba(255, 143, 224, .16)), rgba(10, 14, 40, .82); border-color: rgba(255, 143, 224, .6); color: #ffe3f7; font-weight: 700; font-size: 13px; }
  #leg { position: absolute; z-index: 2; right: 14px; bottom: 14px; background: rgba(10, 14, 40, .78); border: 1px solid rgba(120, 220, 255, .35); border-radius: 14px; padding: 10px 12px; color: #dff3ff; font-size: 12px; line-height: 1.55; pointer-events: none; max-width: calc(100% - 28px); }
  #leg b { color: #fff; }
  @media (max-width: 480px) { .pill { font-size: 13px; padding: 7px 11px; } #leg { font-size: 11px; } }
</style>
</head>
<body>
<div id="frame">
<div id="shade"></div>
<div id="ui"><div class="pill">미래 전망대 안</div><div class="pill tag">관 내부 시안 · 내려다보는 다음 교실</div></div>
<div id="leg"><b>입구(왼쪽)</b> 엘리베이터에서 내려 <b>망원경 ① ② ③ ④</b>를 차례로 들여다봅니다 · 끝에서 메모판에 ‘내가 바라는 미래 교실’ 한 줄<br>전망대 아래·바깥은 리니가 사는 공존 도시(메인 월드와 같은 세계) · 한 사람이 걸어가는 모습을 한 장에 그림 · 글·뜻풀이는 모두 가안 [확인 전]</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(function () {
  const Q = new URLSearchParams(location.search);
  const FONT = '"Noto Sans KR","Malgun Gothic",sans-serif';
  // ?w=390&h=844 → 창 크기와 상관없이 그 크기로 그린다(헤드리스 캡처는 창 너비가 약 500 아래로 안 줄어든다)
  const FW = +Q.get('w') || 0, FH = +Q.get('h') || 0;
  const W = () => FW || innerWidth, H = () => FH || innerHeight;
  const frame = document.getElementById('frame');
  if (FW && FH) { frame.style.width = FW + 'px'; frame.style.height = FH + 'px'; }
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W(), H());
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  frame.insertBefore(renderer.domElement, frame.firstChild);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, W() / H(), 0.1, 1200);
  // three r147은 재질 색 16진수를 그대로 선형값으로 써서 밝게 나온다 → 조명을 안 받는 도시 재질은 lin()으로 보정해 원하는 색에 맞춘다
  const lin = hex => { const f = v => Math.round(255 * Math.pow(v / 255, 2.2)); return (f(hex >> 16 & 255) << 16) | (f(hex >> 8 & 255) << 8) | f(hex & 255); };
  scene.fog = new THREE.Fog(lin(0x2a2272), 58, 150); // 먼 도시는 보랏빛 안개로 흐려진다(전망대는 가까워서 영향 없음)

  // ── 도우미(mockup-hall-concept.html과 같음) ──
  const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; };
  const std = (color, o) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .85, metalness: 0 }, o || {}));
  const glow = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity: opacity == null ? 1 : opacity, blending: THREE.AdditiveBlending, depthWrite: false });
  let CASTS = true; // 도시 쪽 물건은 그림자를 만들지 않는다
  function mesh(geo, mat, x, y, z, cast) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (cast !== false && CASTS) { m.castShadow = true; m.receiveShadow = true; } scene.add(m); return m; }
  function edges(geo, color, x, y, z, op) { const l = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), new THREE.LineBasicMaterial({ color, transparent: true, opacity: op == null ? .95 : op })); l.position.set(x, y, z); return l; }
  function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; };
  let SEED = 23; const rnd = () => (SEED = SEED * 16807 % 2147483647) / 2147483647;
  const NEON = 0x6fe9ff, PINK = 0xff6fd8, MINT = 0x7dffd1, GOLD = 0xffd36b, ACCN = 0xff8fe0;
  const ACC = '#ff8fe0', C_MINT = '#7dffd1';
  const sprMat = (map, extra) => new THREE.SpriteMaterial(Object.assign({ map, transparent: true, depthWrite: false, fog: false }, extra || {}));

  // ── 방 치수: 탑 꼭대기 전망대는 길쭉한 둥근 모양(알약). 길이 36(x -17.4~17.4), 깊이 10.8(z -5.4~5.4) ──
  const R = 5.4, SL = 12.0, WH = 3.8, GY = -22, TZ = -2.8, PZ = -.9;
  // yaw = 망원경이 바깥 도시를 향하는 방향(도, +는 왼쪽 바깥). 부채꼴로 벌어져 서로 다른 곳을 본다
  const STEP = [
    { x: -9.6, n: '1', t: '① AI 튜터 교실', s: 'AI 도우미가 곁에서 도와줘요', p: 'AI 튜터', yaw: 50 },
    { x: -3.2, n: '2', t: '② 디지털 트윈 학교', s: '학교를 똑같이 본뜬 쌍둥이', p: '트윈', yaw: 35 },
    { x: 3.2, n: '3', t: '③ 먼 학교와 함께 수업', s: '멀리 있는 학교와 한 교실처럼', p: '함께', yaw: -35 },
    { x: 9.6, n: '4', t: '④ 홀로그램 수업', s: '눈앞에 떠오르는 입체 수업', p: '홀로그램', yaw: -50 }
  ];

  // ── 카메라(북쪽이 위인 쿼터뷰) ──
  function fitCamera() {
    const asp = W() / H(), pitch = THREE.MathUtils.degToRad(50);
    let D = 42; if (asp < 1.6) D *= 1.6 / asp;
    const tx = 0, ty = 1.2, tz = -.6;
    camera.aspect = asp; camera.updateProjectionMatrix();
    camera.position.set(tx, ty + D * Math.sin(pitch), tz + D * Math.cos(pitch)); camera.lookAt(tx, ty, tz);
    camera.updateMatrixWorld(true);
  }
  fitCamera();

  // ── 하늘(도시 틈새로 조금 보임) ──
  const skyTex = canvasTex(4, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#05071f'); gr.addColorStop(.45, '#1a1a52'); gr.addColorStop(.6, '#2a1f63'); gr.addColorStop(.8, '#120f3d'); gr.addColorStop(1, '#070a26'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(600, 32, 24), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false })));

  // ── 빛 ──
  scene.add(new THREE.HemisphereLight(0xbccaff, 0x2a1f3a, .85));
  const moon = new THREE.DirectionalLight(0xdde6ff, 1.05); moon.position.set(-14, 34, 22); moon.castShadow = true;
  moon.shadow.mapSize.set(2048, 2048); { const sc = moon.shadow.camera; sc.left = -24; sc.right = 24; sc.top = 15; sc.bottom = -15; sc.near = 1; sc.far = 90; } moon.shadow.bias = -0.0005; scene.add(moon);
  [[0xff8fe0, 1.3, 15, 15, 4.5, 1.5], [0x6fe9ff, 1.1, 18, -3, 3.5, -1.2], [0xffc58a, 1.0, 11, -15.5, 3.2, -1.5], [0xb9a6ff, .7, 16, 6, 4, 3.5], [0x7dffd1, .6, 12, -8, 3, 3.5]].forEach(([c, i, d, x, y, z]) => { const l = new THREE.PointLight(c, i, d, 1.6); l.position.set(x, y, z); scene.add(l); });

  // ── 이름표(스프라이트) ──
  function label(title, sub, color, x, y, z, scale) {
    const t = canvasTex(1280, 440, (g, w, h) => {
      g.clearRect(0, 0, w, h); rrect(g, 20, 20, w - 40, h - 40, 88); g.fillStyle = 'rgba(8,12,40,.84)'; g.fill(); g.lineWidth = 12; g.strokeStyle = color; g.shadowColor = color; g.shadowBlur = 48; g.stroke(); g.shadowBlur = 0;
      const fit = (txt, weight, size) => { for (; size > 36; size -= 4) { g.font = weight + ' ' + size + 'px ' + FONT; if (g.measureText(txt).width <= w - 140) break; } };
      g.fillStyle = '#ffffff'; g.textAlign = 'center'; g.textBaseline = 'middle'; fit(title, '900', 124); g.fillText(title, w / 2, sub ? 164 : 220);
      if (sub) { g.fillStyle = 'rgba(220,240,255,.94)'; fit(sub, '600', 74); g.fillText(sub, w / 2, 306); }
    });
    const s = new THREE.Sprite(sprMat(t, { depthTest: false }));
    const k = scale || 1; s.scale.set(9.6 * k, 3.3 * k, 1); s.position.set(x, y, z); s.renderOrder = 10; scene.add(s); return s;
  }
  // 화면(1280×720 기준 비율 fx, fy) 한 점에 이름표를 건다. pxW = 그 화면에서 이름표 가로 픽셀(창 크기와 무관하게 16:9 기준으로 계산)
  function labelAt(fx, fy, d, pxW, title, sub, color) {
    camera.updateMatrixWorld(true);
    const th = Math.tan(THREE.MathUtils.degToRad(16));
    const dir = new THREE.Vector3((fx * 2 - 1) * th * 16 / 9, (1 - fy * 2) * th, -1).normalize().applyQuaternion(camera.quaternion);
    const p = camera.position.clone().addScaledVector(dir, d);
    return label(title, sub, color, p.x, p.y, p.z, pxW * .5734 * d / 720 / 9.6);
  }

  // ───────────────────────── 아래: 밤의 공존 도시 ─────────────────────────
  const haloTex = canvasTex(64, 64, (g, w, h) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  function halo(x, y, z, size, color, op) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color, transparent: true, opacity: op == null ? .9 : op, blending: THREE.AdditiveBlending, depthWrite: false })); s.scale.set(size, size, 1); s.position.set(x, y, z); scene.add(s); return s; }
  function winTex(pal) {
    const t = canvasTex(256, 256, (g, w, h) => {
      g.fillStyle = '#080c30'; g.fillRect(0, 0, w, h);
      const cols = 4, rows = 5, cw = w / cols, rh = h / rows;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { g.fillStyle = rnd() < .5 ? pal[Math.floor(rnd() * pal.length)] : '#10174a'; g.fillRect(c * cw + cw * .24, r * rh + rh * .22, cw * .52, rh * .54); }
    });
    t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
  }
  const WT = [['#ffcf7a', '#ffe0a0', '#ffb85c', '#ffeabf'], ['#8fe6f7', '#b8f0ff', '#6fd4ee', '#d8f8ff'], ['#ffcf7a', '#f08fd0', '#8fe6f7', '#ffeabf'], ['#8ff0c8', '#d0ffea', '#ffe0a0', '#ffcf7a']].map(winTex);
  const TINT = [0xb0b4ff, 0x808cd0, 0x606cb0, 0x485490];
  const SIDE = WT.map(t => TINT.map(c => new THREE.MeshBasicMaterial({ map: t, color: c })));
  const ROOFM = new THREE.MeshBasicMaterial({ color: lin(0x15183f) });
  const GARDEN = new THREE.MeshBasicMaterial({ color: lin(0x1d6a5e) });
  // 창문 무늬가 면 크기에 맞게 반복되도록 UV를 늘린다
  function bGeo(w, h, d, U) {
    const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv, nm = g.attributes.normal;
    for (let i = 0; i < uv.count; i++) {
      const nx = Math.abs(nm.getX(i)), ny = Math.abs(nm.getY(i)); let su, sv;
      if (nx > .5) { su = d; sv = h; } else if (ny > .5) { su = w; sv = d; } else { su = w; sv = h; }
      uv.setXY(i, uv.getX(i) * su / U, uv.getY(i) * sv / U);
    }
    return g;
  }
  CASTS = false;
  // 바닥과 길
  { const gm = new THREE.Mesh(new THREE.PlaneGeometry(220, 140), new THREE.MeshBasicMaterial({ color: lin(0x070a2a) })); gm.rotation.x = -Math.PI / 2; gm.position.set(0, GY, -42); scene.add(gm); }
  const ROADC = [NEON, PINK, GOLD, MINT];
  for (let i = -10; i <= 9; i++) { const m = new THREE.Mesh(new THREE.PlaneGeometry(.34, 120), glow(ROADC[(i + 10) % 4], .3)); m.rotation.x = -Math.PI / 2; m.position.set(i * 7 + 3.5, GY + .08, -44); scene.add(m); }
  for (let j = -13; j <= 2; j++) { const m = new THREE.Mesh(new THREE.PlaneGeometry(160, .34), glow(ROADC[(j + 13) % 4], .26)); m.rotation.x = -Math.PI / 2; m.position.set(0, GY + .08, j * 7 + 3.5); scene.add(m); }
  // 건물
  function bld(x, z, w, d, h, k, roof) {
    const dist = Math.hypot(x, z + 12), ti = dist < 38 ? 0 : dist < 62 ? 1 : dist < 86 ? 2 : 3, sm = SIDE[k][ti];
    const m = new THREE.Mesh(bGeo(w, h, d, 2.4), [sm, sm, roof || ROOFM, ROOFM, sm, sm]); m.position.set(x, GY + h / 2, z); scene.add(m);
    if (!roof) {
      if (rnd() < .26) scene.add(edges(new THREE.BoxGeometry(w, .12, d), [NEON, PINK, MINT, GOLD][(rnd() * 4) | 0], x, GY + h + .06, z, .9));
      if (h > 9 && rnd() < .5) { const a = new THREE.Mesh(new THREE.BoxGeometry(.14, 2.0, .14), ROOFM); a.position.set(x, GY + h + 1.0, z); scene.add(a); halo(x, GY + h + 2.1, z, 2.6, rnd() < .5 ? PINK : NEON, .9); }
    }
    return m;
  }
  const PITCH = 7, SPECIAL = ['-2,0', '-4,0', '2,0', '4,0'];
  for (let i = -9; i <= 9; i++) for (let j = -12; j <= 1; j++) {
    const cx = i * PITCH, cz = j * PITCH;
    if (i === 0 && j >= -1) continue;                    // 탑 몸통 자리
    if (SPECIAL.indexOf(i + ',' + j) >= 0) continue;     // 옥상 정원 건물은 따로
    const dd = Math.hypot(cx * .9, cz + 22), hmax = 3 + 8 * Math.max(0, 1 - dd / 90), B = 5.2, kind = rnd();
    const rh = () => Math.min(15, 1.6 + rnd() * hmax + (dd < 60 && rnd() < .12 ? 4 + rnd() * 5 : 0)), rk = () => (rnd() * 4) | 0;
    if (kind < .3) bld(cx + (rnd() - .5) * .5, cz + (rnd() - .5) * .5, B - rnd() * 1.0, B - rnd() * 1.0, rh(), rk());
    else if (kind < .7) {
      if (rnd() < .5) { const wa = 2.0 + rnd() * 1.0, wb = B - wa - .5; bld(cx - B / 2 + wa / 2, cz, wa, B - rnd() * .6, rh(), rk()); bld(cx + B / 2 - wb / 2, cz, wb, B - rnd() * .6, rh(), rk()); }
      else { const da = 2.0 + rnd() * 1.0, db = B - da - .5; bld(cx, cz - B / 2 + da / 2, B - rnd() * .6, da, rh(), rk()); bld(cx, cz + B / 2 - db / 2, B - rnd() * .6, db, rh(), rk()); }
    } else { [[-1.4, -1.4], [1.4, -1.4], [-1.4, 1.4], [1.4, 1.4]].forEach(([a, b]) => bld(cx + a, cz + b, 2.3 - rnd() * .3, 2.3 - rnd() * .3, rh(), rk())); }
  }
  // 오가는 불빛(자동차·드론)
  { const n = 320, p = new Float32Array(n * 3), c = new Float32Array(n * 3), cols = [[1, .85, .5], [1, .6, .9], [.6, .95, 1], [1, 1, 1]];
    for (let i = 0; i < n; i++) { const onX = rnd() < .5;
      if (onX) { p[i * 3] = (Math.floor(rnd() * 19) - 9) * 7 + 3.5 + (rnd() - .5) * .8; p[i * 3 + 2] = rnd() * 92 - 84; } else { p[i * 3] = rnd() * 126 - 63; p[i * 3 + 2] = (Math.floor(rnd() * 14) - 12) * 7 + 3.5 + (rnd() - .5) * .8; }
      p[i * 3 + 1] = GY + .3 + (rnd() < .2 ? rnd() * 9 : 0); c.set(cols[(rnd() * 4) | 0], i * 3); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('color', new THREE.BufferAttribute(c, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 3, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: .95 }))); }
  // 탑 몸통과 아래 광장
  { const tt = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#0d1338'; g.fillRect(0, 0, w, h); for (let x = 0; x < w; x += 32) { g.fillStyle = 'rgba(111,233,255,.4)'; g.fillRect(x + 12, 0, 5, h); } for (let y = 0; y < h; y += 64) { g.fillStyle = 'rgba(255,143,224,.4)'; g.fillRect(0, y, w, 4); } });
    tt.wrapS = tt.wrapT = THREE.RepeatWrapping; tt.repeat.set(6, 4);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 4.4, 21.2, 40, 1, true), new THREE.MeshBasicMaterial({ map: tt })); trunk.position.set(0, GY + 10.6, .3); scene.add(trunk);
    const pl = new THREE.Mesh(new THREE.RingGeometry(5.2, 8.0, 56), glow(ACCN, .4)); pl.rotation.x = -Math.PI / 2; pl.position.set(0, GY + .12, .3); scene.add(pl);
    const pl2 = new THREE.Mesh(new THREE.CircleGeometry(5.2, 48), glow(NEON, .14)); pl2.rotation.x = -Math.PI / 2; pl2.position.set(0, GY + .1, .3); scene.add(pl2); }
  CASTS = true;

  // ───────────────────────── 전망대 본체 ─────────────────────────
