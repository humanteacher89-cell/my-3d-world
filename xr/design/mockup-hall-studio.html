<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>제작 공방 안 — 관 내부 시안</title>
<!-- 가상융합교육 지도 '제작 공방' 내부 그림 시안(2026-10-07, XR개발부). 조작은 없다. 정해지면 프랑스 로비 room.js 꼴로 다시 만든다.
     틀은 mockup-hall-concept.html과 같다(헤드리스 Chrome 캡처, 폰 세로는 ?w=&h=). 한 장에 흐름을 나란히 그렸다:
     입구('지도로' 발판 + 리니) → ① 공중 선반(골라서 놓기) → ② 작은 섬 판(돌리며 꾸미기) → ③ 카메라 발판(사진 찍기) → ④ 전시 벽(+ 옆 벽 도구 카드).
     같은 방문자 한 사람이 걸어가는 모습을 여러 위치에 둔다. 글은 모두 가안 [확인 전]. -->
<style>
  html, body { margin: 0; height: 100%; background: #0b1035; overflow: hidden; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
  canvas { display: block; }
  #frame { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  #ui { position: absolute; z-index: 2; left: 14px; top: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; max-width: calc(100% - 28px); }
  .pill { max-width: 100%; box-sizing: border-box; background: rgba(10, 14, 40, .74); border: 1px solid rgba(125, 255, 209, .6); color: #e8fff6; border-radius: 999px; padding: 8px 14px; font-weight: 900; font-size: 15px; letter-spacing: -.2px; box-shadow: 0 0 18px rgba(125, 255, 209, .25); }
  .tag { background: rgba(125, 255, 209, .14); border-color: rgba(125, 255, 209, .55); color: #dffff2; font-weight: 700; font-size: 13px; }
  #leg { position: absolute; z-index: 2; right: 14px; bottom: 14px; background: rgba(10, 14, 40, .74); border: 1px solid rgba(125, 255, 209, .35); border-radius: 14px; padding: 10px 12px; color: #dff3ff; font-size: 12px; line-height: 1.55; pointer-events: none; max-width: calc(100% - 28px); }
  #leg b { color: #fff; }
  @media (max-width: 480px) { .pill { font-size: 13px; padding: 7px 11px; } #leg { font-size: 11px; } }
</style>
</head>
<body>
<div id="frame">
<div id="ui"><div class="pill">제작 공방 안</div><div class="pill tag">관 내부 시안 · 직접 만드는 작업대</div></div>
<div id="leg"><b>입구(왼쪽)</b>에서 오른쪽으로 걸으며 <b>① 부품 고르기 → ② 섬 판 꾸미기 → ③ 사진 찍기</b> · 끝에서 전시 벽에 걸면 같이 접속한 사람 작품도 보이고, 옆 벽에 도구 카드 3장<br>한 사람이 걸어가는 모습을 한 장에 나란히 그림 · 글·뜻풀이는 모두 가안 [확인 전]</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(function () {
  const Q = new URLSearchParams(location.search);
  const FONT = '"Noto Sans KR","Malgun Gothic",sans-serif';
  // ?w=390&h=844 → 창 크기와 상관없이 그 크기로 그린다(헤드리스 캡처는 창 너비가 약 500 아래로 안 줄어든다)
  const FW = +Q.get('w') || 0, FH = +Q.get('h') || 0;
  const W = () => FW || innerWidth, H = () => FH || innerHeight;
  const frameEl = document.getElementById('frame');
  if (FW && FH) { frameEl.style.width = FW + 'px'; frameEl.style.height = FH + 'px'; }
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W(), H());
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  frameEl.insertBefore(renderer.domElement, frameEl.firstChild);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, W() / H(), 0.1, 1200);

  // ── 도우미(mockup-hall-concept.html과 같음) ──
  const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; };
  const std = (color, o) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .85, metalness: 0 }, o || {}));
  const glow = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity: opacity == null ? 1 : opacity, blending: THREE.AdditiveBlending, depthWrite: false });
  // 바로 장면에 넣는다(묶음에 g.add 하면 거기로 옮겨 간다)
  function mesh(geo, mat, x, y, z, cast) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (cast !== false) { m.castShadow = true; m.receiveShadow = true; } scene.add(m); return m; }
  function edges(geo, color, x, y, z, op) { const l = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), new THREE.LineBasicMaterial({ color, transparent: true, opacity: op == null ? .95 : op })); l.position.set(x, y, z); return l; }
  function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; };
  let SEED = 23; const rnd = () => (SEED = SEED * 16807 % 2147483647) / 2147483647;
  const NEON = 0x6fe9ff, PINK = 0xff6fd8, MINT = 0x7dffd1, GOLD = 0xffd36b, ACC = '#7dffd1';
  // 묶음에 넣을 물체(장면에 바로 넣지 않는다)
  const mk = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); m.castShadow = true; m.receiveShadow = true; return m; };
  const toon = (c, o) => std(c, Object.assign({ roughness: .55 }, o || {}));

  // ── 방 치수: 길이 34(x -17~17), 깊이 12(z -6~6), 벽 높이 5.4 ──
  const X0 = -17, ZB = -6, WH = 5.4, PADZ = 4.6;
  const SH = { x: -10.6, w: 6.0 };            // 공중 선반 가운데
  const IS = { x: -2.4, z: -1.2, r: 2.7 };    // 섬 판 가운데
  const TIER = [{ y: .95, z: -1.7 }, { y: 2.05, z: -3.0 }, { y: 3.15, z: -4.3 }];

  // ── 바깥: 밤하늘 + 성운(개념관과 같음) ──
  const skyTex = canvasTex(4, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#05071f'); gr.addColorStop(.45, '#1a1a52'); gr.addColorStop(.6, '#2a1f63'); gr.addColorStop(.8, '#120f3d'); gr.addColorStop(1, '#070a26'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(600, 32, 24), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide })));
  (function stars() {
    const n = 2600, p = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { const a = rnd() * Math.PI * 2, e = Math.acos(rnd() * 2 - 1), r = 540; p[i * 3] = r * Math.sin(e) * Math.cos(a); p[i * 3 + 1] = r * Math.cos(e); p[i * 3 + 2] = r * Math.sin(e) * Math.sin(a); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 2.0, sizeAttenuation: false, transparent: true, opacity: .8 })));
  })();
  const nebTex = canvasTex(512, 256, (g, w, h) => { g.clearRect(0, 0, w, h); [[.22, .5, .3, '120,110,255'], [.5, .42, .34, '90,230,200'], [.78, .56, .3, '80,160,255'], [.42, .66, .22, '255,120,220']].forEach(([fx, fy, fr, c]) => { const gr = g.createRadialGradient(fx * w, fy * h, 4, fx * w, fy * h, fr * w); gr.addColorStop(0, 'rgba(' + c + ',.5)'); gr.addColorStop(1, 'rgba(' + c + ',0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }); });
  const NEBS = [];
  [[34, -30, -60, 110], [-30, -40, -70, 90], [10, -70, 40, 120]].forEach(([x, y, z, s]) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s / 2), new THREE.MeshBasicMaterial({ map: nebTex, transparent: true, opacity: .7, blending: THREE.AdditiveBlending, depthWrite: false })); m.position.set(x, y, z); scene.add(m); NEBS.push(m); });

  // ── 빛 ──
  scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x1c2a60, .6));
  const sun = new THREE.DirectionalLight(0xe9f2ff, .85); sun.position.set(-14, 28, 18); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); { const sc = sun.shadow.camera; sc.left = -26; sc.right = 26; sc.top = 20; sc.bottom = -20; sc.near = 1; sc.far = 90; } sun.shadow.bias = -0.0005; scene.add(sun);
  [[0x7dffd1, 1.1, 14, SH.x, 4.8, 0], [0x7dffd1, 1.0, 14, IS.x, 3.8, 1.2], [0x6fe9ff, .9, 12, 3.6, 3.2, 2.0], [0xff9de8, .9, 14, 9.5, 3.4, -2.0], [0xffc58a, .7, 10, -14.5, 3, 2]].forEach(([c, i, d, x, y, z]) => { const l = new THREE.PointLight(c, i, d, 1.6); l.position.set(x, y, z); scene.add(l); });

  // ── 이름표(스프라이트) ──
  function label(title, sub, color, x, y, z, scale) {
    const t = canvasTex(1280, 440, (g, w, h) => {
      g.clearRect(0, 0, w, h); rrect(g, 20, 20, w - 40, h - 40, 88); g.fillStyle = 'rgba(8,12,40,.82)'; g.fill(); g.lineWidth = 12; g.strokeStyle = color; g.shadowColor = color; g.shadowBlur = 48; g.stroke(); g.shadowBlur = 0;
      const fit = (txt, weight, size) => { for (; size > 36; size -= 4) { g.font = weight + ' ' + size + 'px ' + FONT; if (g.measureText(txt).width <= w - 140) break; } };
      g.fillStyle = '#ffffff'; g.textAlign = 'center'; g.textBaseline = 'middle'; fit(title, '900', 124); g.fillText(title, w / 2, sub ? 164 : 220);
      if (sub) { g.fillStyle = 'rgba(220,240,255,.94)'; fit(sub, '600', 74); g.fillText(sub, w / 2, 306); }
    });
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, depthTest: false }));
    const k = scale || 1; s.scale.set(9.6 * k, 3.3 * k, 1); s.position.set(x, y, z); s.renderOrder = 10; scene.add(s); return s;
  }
  function spriteGlow(rgb, size, op, x, y, z) {
    const t = canvasTex(128, 128, (g, w, h) => { const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); gr.addColorStop(0, 'rgba(' + rgb + ',1)'); gr.addColorStop(.35, 'rgba(' + rgb + ',.45)'); gr.addColorStop(1, 'rgba(' + rgb + ',0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: op }));
    s.scale.set(size, size, 1); s.position.set(x, y, z); scene.add(s); return s;
  }
  function beam(a, b, r, color, op) { // 두 점 사이의 가는 빛줄
    const d = new THREE.Vector3().subVectors(b, a), len = d.length();
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8, 1, true), glow(color, op));
    m.position.copy(a).addScaledVector(d, .5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize()); scene.add(m); return m;
  }
  function dotted(pts, n, r) { // 점선 곡선(끝으로 갈수록 진해진다)
    const curve = new THREE.CatmullRomCurve3(pts);
    for (let i = 0; i <= n; i++) { const p = curve.getPoint(i / n); const d = new THREE.Mesh(new THREE.SphereGeometry(r * (.7 + .5 * (i / n)), 10, 8), glow(0xc6ffe9, .45 + .55 * (i / n))); d.position.copy(p); scene.add(d); }
    return curve;
  }

  // ── 바닥: 남색 슬래브 + 민트 빛 격자 ──
  mesh(new THREE.BoxGeometry(34, .8, 12), std(0x141b58, { roughness: .6 }), 0, -.4, 0);
  scene.add(edges(new THREE.BoxGeometry(34, .8, 12), MINT, 0, -.4, 0, .9));
  const floorTex = canvasTex(2720, 960, (g, w, h) => {
    g.fillStyle = '#0d1447'; g.fillRect(0, 0, w, h);
    const spot = (x, z, r, c, a) => { const px = (x + 17) * 80, py = (z + 6) * 80, rr = r * 80; const gr = g.createRadialGradient(px, py, 10, px, py, rr); gr.addColorStop(0, 'rgba(' + c + ',' + a + ')'); gr.addColorStop(1, 'rgba(' + c + ',0)'); g.fillStyle = gr; g.fillRect(px - rr, py - rr, rr * 2, rr * 2); };
    spot(SH.x, -1.5, 4.8, '125,255,209', .15); spot(IS.x, IS.z, 5.6, '125,255,209', .2); spot(3.6, 1.8, 3.6, '111,233,255', .15); spot(10, -1.5, 6, '255,143,224', .11);
    for (let x = 0; x <= w; x += 40) { const mj = x % 160 === 0; g.strokeStyle = mj ? 'rgba(125,255,209,.85)' : 'rgba(125,255,209,.34)'; g.lineWidth = mj ? 3 : 1.5; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let y = 0; y <= h; y += 40) { const mj = y % 160 === 0; g.strokeStyle = mj ? 'rgba(125,255,209,.85)' : 'rgba(125,255,209,.34)'; g.lineWidth = mj ? 3 : 1.5; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  });
  { const f = new THREE.Mesh(new THREE.PlaneGeometry(34, 12), new THREE.MeshBasicMaterial({ map: floorTex })); f.rotation.x = -Math.PI / 2; f.position.y = .01; scene.add(f); }
  { const s = new THREE.Mesh(new THREE.PlaneGeometry(34, 12), new THREE.ShadowMaterial({ opacity: .4 })); s.rotation.x = -Math.PI / 2; s.position.y = .02; s.receiveShadow = true; scene.add(s); }

  // ── 벽: 왼쪽(입구) + 뒷벽. 오른쪽 끝은 트여 있다 ──
  function wallMat(rep) {
    const t = canvasTex(256, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#262c86'); gr.addColorStop(1, '#10165a'); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(125,255,209,.13)'; g.fillRect(0, 0, 2, h); g.fillRect(0, h * .94, w, h * .06); });
    t.wrapS = THREE.RepeatWrapping; t.repeat.set(rep, 1); return std(0xffffff, { map: t, roughness: .7 });
  }
  mesh(new THREE.BoxGeometry(34.3, WH, .3), wallMat(8.5), 0, WH / 2, ZB - .15);
  mesh(new THREE.BoxGeometry(.3, WH, 12), wallMat(3), X0 - .15, WH / 2, 0);
  const trim = (w, h, d, x, y, z, op) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glow(MINT, op == null ? .9 : op)); m.position.set(x, y, z); scene.add(m); return m; };
  trim(34.3, .09, .36, 0, WH, ZB - .15); trim(.36, .09, 12, X0 - .15, WH, 0); trim(34, .06, .06, 0, .05, ZB + .03, .85);
  [-13.7, -7.3, 1.0, 4.7].forEach(x => trim(.07, WH, .36, x, WH / 2, ZB - .15, .5)); // 칸 나누는 빛줄
  // 섬 판 뒤 벽: 설계도 느낌의 빛 그림(글자 없음)
  { const t = canvasTex(768, 384, (g, w, h) => {
      g.clearRect(0, 0, w, h); g.strokeStyle = 'rgba(125,255,209,.7)'; g.lineWidth = 3; g.lineCap = 'round';
      rrect(g, 14, 14, w - 28, h - 28, 22); g.setLineDash([14, 10]); g.stroke(); g.setLineDash([]);
      g.beginPath(); g.ellipse(w / 2, 212, 190, 42, 0, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.moveTo(w / 2 - 190, 212); g.quadraticCurveTo(w / 2 - 120, 300, w / 2, 330); g.quadraticCurveTo(w / 2 + 120, 300, w / 2 + 190, 212); g.stroke();
      g.beginPath(); g.moveTo(w / 2 - 128, 206); g.lineTo(w / 2 - 128, 156); g.lineTo(w / 2 - 100, 130); g.lineTo(w / 2 - 72, 156); g.lineTo(w / 2 - 72, 206); g.stroke();
      g.beginPath(); g.moveTo(w / 2 + 92, 208); g.lineTo(w / 2 + 92, 190); g.moveTo(w / 2 + 92, 190); g.lineTo(w / 2 + 70, 190); g.lineTo(w / 2 + 92, 120); g.lineTo(w / 2 + 114, 190); g.lineTo(w / 2 + 92, 190); g.stroke();
      g.beginPath(); g.moveTo(40, 60); g.lineTo(40, 340); g.moveTo(28, 60); g.lineTo(52, 60); g.moveTo(28, 340); g.lineTo(52, 340); g.moveTo(90, 356); g.lineTo(w - 90, 356); g.moveTo(90, 344); g.lineTo(90, 368); g.moveTo(w - 90, 344); g.lineTo(w - 90, 368); g.stroke();
    });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 3.2), new THREE.MeshBasicMaterial({ map: t, transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false })); m.position.set(IS.x, 2.7, ZB + .02); scene.add(m); }

  // ── 입구: 왼쪽 벽의 빛 문 + '지도로' 발판 ──
  const doorTex = canvasTex(256, 352, (g, w, h) => {
    g.clearRect(0, 0, w, h); rrect(g, 20, 18, w - 40, h - 18, 74);
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(125,255,209,.12)'); gr.addColorStop(1, 'rgba(125,255,209,.55)'); g.fillStyle = gr; g.fill();
    g.lineWidth = 12; g.strokeStyle = ACC; g.shadowColor = ACC; g.shadowBlur = 26; g.stroke(); g.shadowBlur = 0;
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 5; g.beginPath(); g.moveTo(w / 2, 70); g.lineTo(w / 2, h - 10); g.stroke();
  });
  { const door = mesh(new THREE.PlaneGeometry(1.9, 2.6), new THREE.MeshBasicMaterial({ map: doorTex, transparent: true, depthWrite: false }), X0 + .02, 1.3, 4.0, false); door.rotation.y = Math.PI / 2; door.renderOrder = 2; }
  const matTex = canvasTex(512, 256, (g, w, h) => { rrect(g, 8, 8, w - 16, h - 16, 40); g.fillStyle = 'rgba(255,211,107,.25)'; g.fill(); g.lineWidth = 10; g.strokeStyle = '#ffd36b'; g.stroke(); g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '900 92px ' + FONT; g.fillText('지도로', w / 2, h / 2); });
  { const m = new THREE.Mesh(new THREE.PlaneGeometry(1.7, .85), new THREE.MeshBasicMaterial({ map: matTex, transparent: true, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.set(X0 + 1.05, .05, 4.0); m.renderOrder = 3; scene.add(m); }

  // ── 부품 만들기(선반 위·섬 판 위에 같이 쓴다) ──
  function tree(s, c1, c2) {
    const g = new THREE.Group();
    g.add(mk(new THREE.CylinderGeometry(.09, .12, .5, 8), toon(0x8a5a3a), 0, .25, 0));
    g.add(mk(new THREE.ConeGeometry(.5, .8, 10), toon(c1 || 0x2fae5c), 0, .85, 0));
    g.add(mk(new THREE.ConeGeometry(.38, .65, 10), toon(c2 || 0x47c874), 0, 1.3, 0));
    g.scale.setScalar(s || 1); return g;
  }
  function house(s, wall, roof) {
    const g = new THREE.Group();
    g.add(mk(new THREE.BoxGeometry(1.0, .7, .9), toon(wall || 0xf3e3c4), 0, .35, 0));
    const r = mk(new THREE.ConeGeometry(.82, .55, 4), toon(roof || 0xe8553f), 0, .97, 0); r.rotation.y = Math.PI / 4; g.add(r);
    g.add(mk(new THREE.BoxGeometry(.22, .4, .05), toon(0x8a5a3a), 0, .2, .46));
    [-.3, .3].forEach(x => g.add(mk(new THREE.BoxGeometry(.2, .2, .05), new THREE.MeshStandardMaterial({ color: 0xbfe6ff, emissive: 0x6fe9ff, emissiveIntensity: .55 }), x, .48, .46)));
    g.scale.setScalar(s || 1); return g;
  }
