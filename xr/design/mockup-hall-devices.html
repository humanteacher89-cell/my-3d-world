<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>장비관 안 — 관 내부 시안</title>
<!-- 가상융합교육 지도 '장비관' 내부 그림 시안(2026-10-07, XR개발부). 조작은 없다. 정해지면 프랑스 로비 room.js 꼴로 다시 만든다.
     하얀 쇼룸 한 칸 안에 ① 전시대 5개 → ② 회전 무대(헤드셋 + 카드 3장) → ③ 잠깐 체험(렌즈 시점 창) → 끝(상황 고르기)을 한 줄로 그렸다.
     같은 방문자 한 사람이 왼쪽 입구에서 오른쪽으로 걸어가는 모습. 개념관 시안(mockup-hall-concept.html)과 같은 틀.
     캡처: 주소 뒤에 ?still 을 붙이면 헤드셋이 멈춘 앞모습으로 찍힌다(안 붙이면 계속 돈다). 폰 세로는 ?w=390&h=844. -->
<style>
  html, body { margin: 0; height: 100%; background: #0b1035; overflow: hidden; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
  canvas { display: block; }
  #frame { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  #ui { position: absolute; z-index: 2; left: 14px; top: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; max-width: calc(100% - 28px); }
  .pill { max-width: 100%; box-sizing: border-box; background: rgba(10, 14, 40, .74); border: 1px solid rgba(111, 233, 255, .65); color: #e8f6ff; border-radius: 999px; padding: 8px 14px; font-weight: 900; font-size: 15px; letter-spacing: -.2px; box-shadow: 0 0 18px rgba(111, 233, 255, .28); }
  .tag { background: rgba(111, 233, 255, .14); border-color: rgba(111, 233, 255, .7); color: #d9fbff; font-weight: 700; font-size: 13px; }
  #leg { position: absolute; z-index: 2; right: 14px; bottom: 14px; background: rgba(10, 14, 40, .74); border: 1px solid rgba(111, 233, 255, .4); border-radius: 14px; padding: 10px 12px; color: #dff3ff; font-size: 12px; line-height: 1.55; pointer-events: none; max-width: calc(100% - 28px); }
  #leg b { color: #fff; }
  @media (max-width: 480px) { .pill { font-size: 13px; padding: 7px 11px; } #leg { font-size: 11px; } }
</style>
</head>
<body>
<div id="frame">
<div id="ui"><div class="pill">장비관 안</div><div class="pill tag">관 내부 시안 · 써 보는 쇼룸</div></div>
<div id="leg"><b>입구(왼쪽)</b>에서 오른쪽으로 걸으면 <b>① 전시대 → ② 회전 무대 → ③ 잠깐 체험</b> · 끝에서 상황 고르기 버튼 3개<br>한 사람이 걸어가는 모습을 한 장에 나란히 그림 · 글·뜻풀이는 모두 가안 [확인 전]</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(function () {
  const Q = new URLSearchParams(location.search);
  const FONT = '"Noto Sans KR","Malgun Gothic",sans-serif';
  // ?w=390&h=844 → 창 크기와 상관없이 그 크기로 그린다(헤드리스 캡처는 창 너비가 약 500 아래로 안 줄어든다)
  const FW = +Q.get('w') || 0, FH = +Q.get('h') || 0;
  const STILL = Q.has('still');   // ?still → 헤드셋·렌즈 시점이 멈춘 모습(캡처용)
  const W = () => FW || innerWidth, H = () => FH || innerHeight;
  const frame = document.getElementById('frame');
  if (FW && FH) { frame.style.width = FW + 'px'; frame.style.height = FH + 'px'; }
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W(), H());
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  frame.insertBefore(renderer.domElement, frame.firstChild);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, W() / H(), 0.1, 1200);

  // ── 도우미(mockup-hall-concept.html과 같음 + 몇 개 더) ──
  const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t; };
  const std = (color, o) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .85, metalness: 0 }, o || {}));
  const glow = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity: opacity == null ? 1 : opacity, blending: THREE.AdditiveBlending, depthWrite: false });
  const basic = (color, o) => new THREE.MeshBasicMaterial(Object.assign({ color }, o || {}));
  // 하얀 방 위에서는 더하기(빛) 섞기가 안 보여서, 보통 섞기로 진한 하늘색을 깐다
  const ink = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity: opacity == null ? 1 : opacity, depthWrite: false });
  // 바로 장면에 넣는다(묶음에 g.add 하면 거기로 옮겨 간다)
  function mesh(geo, mat, x, y, z, cast) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (cast !== false) { m.castShadow = true; m.receiveShadow = true; } scene.add(m); return m; }
  function edges(geo, color, x, y, z, op) { const l = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), new THREE.LineBasicMaterial({ color, transparent: true, opacity: op == null ? .95 : op })); l.position.set(x, y, z); return l; }
  function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; };
  let SEED = 11; const rnd = () => (SEED = SEED * 16807 % 2147483647) / 2147483647;
  // 둥근 모서리 상자(앞면이 +z)
  function rbox(w, h, d, r, bev) {
    const b = bev == null ? Math.min(r * .4, d * .3) : bev;
    const ww = w - 2 * b, hh = h - 2 * b, rr = Math.max(Math.min(r - b, ww / 2 - .001, hh / 2 - .001), .001);
    const x = -ww / 2, y = -hh / 2, s = new THREE.Shape();
    s.moveTo(x + rr, y); s.lineTo(x + ww - rr, y); s.quadraticCurveTo(x + ww, y, x + ww, y + rr);
    s.lineTo(x + ww, y + hh - rr); s.quadraticCurveTo(x + ww, y + hh, x + ww - rr, y + hh);
    s.lineTo(x + rr, y + hh); s.quadraticCurveTo(x, y + hh, x, y + hh - rr);
    s.lineTo(x, y + rr); s.quadraticCurveTo(x, y, x + rr, y);
    const dep = Math.max(d - 2 * b, .002);
    const geo = new THREE.ExtrudeGeometry(s, { depth: dep, bevelEnabled: b > .0005, bevelThickness: b, bevelSize: b, bevelSegments: 2, curveSegments: 6 });
    geo.translate(0, 0, -dep / 2); return geo;
  }
  // 글씨가 칸에 들어갈 때까지 크기를 줄인다
  function fit(g, txt, weight, size, maxW, minSize) {
    size = Math.round(size);
    for (; size > minSize; size -= 2) { g.font = weight + ' ' + size + 'px ' + FONT; if (g.measureText(txt).width <= maxW) return size; }
    g.font = weight + ' ' + minSize + 'px ' + FONT; return minSize;
  }
  const ACC = 0x6fe9ff, ACC_D = 0x16b4da, MINT = 0x7dffd1, GOLD = 0xffd36b, NAVY = 0x0f1840;
  const C_ACC = '#6fe9ff', C_MINT = '#7dffd1', C_GOLD = '#ffd36b';
  const PITCH = THREE.MathUtils.degToRad(50);
  const BILL = [];   // 카메라를 마주 보게 세워 둘 판들(fitCamera에서 맞춘다)

  // ── 방 치수: 길이 34(x -17~17), 깊이 11(z -5.5~5.5), 벽 높이 4.2 ──
  const X0 = -17, X1 = 17, ZB = -5.5, WH = 4.2, PADZ = 4.0;
  // 칸 가운데(가로): 전시대 5개 -14.5 … -6.9 / 무대 -0.1 / 체험 7.6 / 끝 14.0
  // (헤드셋 전시대를 무대 쪽 맨 끝에 둬서, 앞에 서면 헤드셋이 가까운 무대로 날아가는 길이 짧게 보인다)
  const SXS = [-14.5, -12.6, -10.7, -8.8, -6.9];
  const MID = SXS[2];                                 // 전시대 줄 가운데
  const STX = -0.1, STZ = -0.8, STR = 2.05;          // 회전 무대
  const EXX = 7.6, EXZ = 1.6;                         // 체험 자리
  const CNX = 14.1, CNZ = -1.3;                       // 끝 콘솔

  // ── 바깥: 돔 안의 밤하늘 + 성운(개념관과 같음) ──
  const skyTex = canvasTex(4, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#05071f'); gr.addColorStop(.45, '#1a1a52'); gr.addColorStop(.6, '#2a1f63'); gr.addColorStop(.8, '#120f3d'); gr.addColorStop(1, '#070a26'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(600, 32, 24), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide })));
  (function stars() {
    const n = 2600, p = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { const a = rnd() * Math.PI * 2, e = Math.acos(rnd() * 2 - 1), r = 540; p[i * 3] = r * Math.sin(e) * Math.cos(a); p[i * 3 + 1] = r * Math.cos(e); p[i * 3 + 2] = r * Math.sin(e) * Math.sin(a); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 2.0, sizeAttenuation: false, transparent: true, opacity: .8 })));
  })();
  const nebTex = canvasTex(512, 256, (g, w, h) => { g.clearRect(0, 0, w, h); [[.22, .5, .3, '150,90,255'], [.5, .42, .34, '255,90,200'], [.78, .56, .3, '80,160,255'], [.42, .66, .22, '120,255,220']].forEach(([fx, fy, fr, c]) => { const gr = g.createRadialGradient(fx * w, fy * h, 4, fx * w, fy * h, fr * w); gr.addColorStop(0, 'rgba(' + c + ',.5)'); gr.addColorStop(1, 'rgba(' + c + ',0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }); });
  const NEBS = [];
  [[34, -30, -60, 110], [-30, -40, -70, 90], [10, -70, 40, 120]].forEach(([x, y, z, s]) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s / 2), new THREE.MeshBasicMaterial({ map: nebTex, transparent: true, opacity: .75, blending: THREE.AdditiveBlending, depthWrite: false })); m.position.set(x, y, z); scene.add(m); NEBS.push(m); });

  // ── 빛(하얀 방이라 밝게, 네온 쪽은 하늘색 점광원) ──
  scene.add(new THREE.HemisphereLight(0xeef4ff, 0x8d9fd8, .8));
  const sun = new THREE.DirectionalLight(0xffffff, 1.15); sun.position.set(-14, 28, 20); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); { const sc = sun.shadow.camera; sc.left = -26; sc.right = 26; sc.top = 20; sc.bottom = -20; sc.near = 1; sc.far = 90; } sun.shadow.bias = -0.0005; scene.add(sun);
  [[0x6fe9ff, 1.0, 14, -10.2, 3.4, -2.2], [0x6fe9ff, 1.3, 14, STX, 3.8, -1.2], [0x7dffd1, 1.0, 13, EXX, 3.4, 0], [0x6fe9ff, 1.0, 13, CNX, 3.2, -1.5], [0xffd9a8, .6, 10, -15.2, 3, 2.5]].forEach(([c, i, d, x, y, z]) => { const l = new THREE.PointLight(c, i, d, 1.6); l.position.set(x, y, z); scene.add(l); });

  // ── 번짐(네온 띠 둘레의 빛, 하얀 벽 위에서도 보이게 보통 섞기) ──
  const haloTex = canvasTex(8, 64, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#000'); gr.addColorStop(.5, '#fff'); gr.addColorStop(1, '#000'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  function halo(w, h, color, op, x, y, z, flat) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color, alphaMap: haloTex, transparent: true, opacity: op, depthWrite: false })); if (flat) m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); scene.add(m); return m; }

  // ── 바닥 판(하얀 판이 밤하늘에 떠 있는 모형) ──
  mesh(new THREE.BoxGeometry(34, .8, 11), std(0xd9e1f4, { roughness: .6 }), 0, -.4, 0);
  mesh(new THREE.BoxGeometry(34.1, .09, .09), basic(ACC_D), 0, 0, 5.53, false);
  halo(34, 1.0, ACC_D, .5, 0, -.1, 5.58, false);
  const floorTex = canvasTex(1360, 440, (g, w, h) => {
    g.fillStyle = '#e3eaf6'; g.fillRect(0, 0, w, h);
    for (let cy = 0; cy < 11; cy++) for (let cx = 0; cx < 34; cx++) if ((cx + cy) % 2 === 0) { g.fillStyle = 'rgba(247,250,255,.7)'; g.fillRect(cx * 40, cy * 40, 40, 40); }
    g.strokeStyle = 'rgba(120,146,196,.5)'; g.lineWidth = 2;
    for (let x = 0; x <= w; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let y = 0; y <= h; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    // 걸어가는 길(발판 줄)을 따라 하늘색 점선
    g.setLineDash([24, 14]); g.lineWidth = 7; g.strokeStyle = 'rgba(22,180,218,.8)'; g.beginPath(); g.moveTo(0, (PADZ + 5.5) / 11 * h); g.lineTo(w, (PADZ + 5.5) / 11 * h); g.stroke(); g.setLineDash([]);
  });
  const floor = mesh(new THREE.PlaneGeometry(34, 11), std(0xffffff, { map: floorTex, roughness: .4 }), 0, .01, 0, false); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;

  // ── 벽: 뒷벽·왼쪽 벽(입구)·오른쪽 벽(출구). 밝은 판벽 + 네온 띠 ──
  const WALLM = std(0xfafcff, { roughness: .9 });
  mesh(new THREE.BoxGeometry(34.6, WH, .3), WALLM, 0, WH / 2, ZB - .15);
  mesh(new THREE.BoxGeometry(.3, WH, 11), WALLM, X0 - .15, WH / 2, 0);
  mesh(new THREE.BoxGeometry(.3, WH, 11), WALLM, X1 + .15, WH / 2, 0);
  const wallTexOf = units => canvasTex(Math.round(units * 60), 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#fbfdff'); gr.addColorStop(1, '#eaf0fa'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(130,155,200,.5)'; g.lineWidth = 3; for (let x = 0; x <= w; x += 120) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    g.fillStyle = '#d3ddf0'; g.fillRect(0, h * .9, w, h * .1);
  });
  mesh(new THREE.PlaneGeometry(34, WH), std(0xffffff, { map: wallTexOf(34), roughness: .9 }), 0, WH / 2, ZB + .012, false);
  { const l = mesh(new THREE.PlaneGeometry(11, WH), std(0xffffff, { map: wallTexOf(11), roughness: .9 }), X0 + .012, WH / 2, 0, false); l.rotation.y = Math.PI / 2;
    const r = mesh(new THREE.PlaneGeometry(11, WH), std(0xffffff, { map: wallTexOf(11), roughness: .9 }), X1 - .012, WH / 2, 0, false); r.rotation.y = -Math.PI / 2; }
  mesh(new THREE.BoxGeometry(34, .1, .06), basic(ACC_D), 0, 3.78, ZB + .04, false);          // 윗 네온 띠
  halo(34, 1.3, ACC_D, .4, 0, 3.78, ZB + .05, false);
  mesh(new THREE.BoxGeometry(34, .07, .06), basic(ACC_D), 0, .16, ZB + .04, false);          // 아랫 네온 띠
  [X0 + .04, X1 - .04].forEach(x => mesh(new THREE.BoxGeometry(.06, .1, 11), basic(ACC_D), x, 3.78, 0, false));
  [X0 + .06, X1 - .06].forEach(x => mesh(new THREE.BoxGeometry(.1, WH, .08), basic(ACC_D), x, WH / 2, ZB + .05, false));   // 뒤쪽 모서리 세로 띠

  // ── 입구 문 + '지도로' 발판(왼쪽), 출구 문(오른쪽) ──
  const doorTexOf = col => canvasTex(256, 352, (g, w, h) => {
    g.fillStyle = '#e9f4fb'; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(120,200,235,.85)'; g.fillRect(26, 26, 90, h - 52); g.fillRect(w - 116, 26, 90, h - 52);
    g.strokeStyle = col; g.lineWidth = 14; g.shadowColor = col; g.shadowBlur = 16; g.strokeRect(14, 14, w - 28, h - 28); g.shadowBlur = 0;
    g.fillStyle = col; g.fillRect(w / 2 - 3, 20, 6, h - 40);
  });
  const doorL = mesh(new THREE.PlaneGeometry(1.9, 2.6), basic(0xffffff, { map: doorTexOf('#16b4da') }), X0 + .03, 1.3, PADZ - .2, false); doorL.rotation.y = Math.PI / 2;
  const doorR = mesh(new THREE.PlaneGeometry(1.9, 2.6), basic(0xffffff, { map: doorTexOf('#f0b429') }), X1 - .03, 1.3, PADZ - .2, false); doorR.rotation.y = -Math.PI / 2;
  const matTex = canvasTex(512, 256, (g, w, h) => { rrect(g, 8, 8, w - 16, h - 16, 40); g.fillStyle = 'rgba(10,14,40,.88)'; g.fill(); g.lineWidth = 12; g.strokeStyle = '#ffd36b'; g.stroke(); g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '900 92px ' + FONT; g.fillText('지도로', w / 2, h / 2); });
  { const m = new THREE.Mesh(new THREE.PlaneGeometry(1.7, .85), new THREE.MeshBasicMaterial({ map: matTex, transparent: true, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.set(X0 + 1.05, .05, PADZ - .2); m.renderOrder = 3; scene.add(m); }

  // ── 이름표(스프라이트) ──
  function tag(title, sub, color, x, y, z, w) {
    const asp = sub ? 2.9 : 3.5, cw = 960, ch = Math.round(cw / asp);
    const t = canvasTex(cw, ch, (g, W_, H_) => {
      g.clearRect(0, 0, W_, H_); rrect(g, 12, 12, W_ - 24, H_ - 24, H_ * .32); g.fillStyle = 'rgba(8,12,40,.88)'; g.fill();
      g.lineWidth = 9; g.strokeStyle = color; g.shadowColor = color; g.shadowBlur = 30; g.stroke(); g.shadowBlur = 0;
      g.fillStyle = '#ffffff'; g.textAlign = 'center'; g.textBaseline = 'middle';
      fit(g, title, '900', sub ? H_ * .42 : H_ * .56, W_ - 90, 22); g.fillText(title, W_ / 2, sub ? H_ * .36 : H_ * .5);
      if (sub) { g.fillStyle = 'rgba(220,240,255,.95)'; fit(g, sub, '700', H_ * .23, W_ - 90, 18); g.fillText(sub, W_ / 2, H_ * .74); }
    });
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, depthTest: false }));
    s.scale.set(w, w / asp, 1); s.position.set(x, y, z); s.renderOrder = 10; scene.add(s); return s;
  }

  // ── 바닥 서는 자리(고리) ──
  function spot(x, z, r, color, a) {
    const t = canvasTex(256, 256, (g, w, h) => {
      g.clearRect(0, 0, w, h); const gr = g.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w / 2); gr.addColorStop(0, hexA(color, .34 * a)); gr.addColorStop(.75, hexA(color, .16 * a)); gr.addColorStop(1, hexA(color, 0)); g.fillStyle = gr; g.fillRect(0, 0, w, h);
