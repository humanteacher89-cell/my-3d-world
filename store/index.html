<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>편의점에 가요 · 한국어 배우기</title>
<style>
  :root { --ink:#29263a; --dim:#6f6a80; --paper:#ffffff; }
  html, body { margin:0; height:100%; overflow:hidden; background:#eef1e6; font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif; color:var(--ink); }
  canvas { display:block; touch-action:none; }
  #cover { position:fixed; inset:0; display:grid; place-items:center; background:linear-gradient(#cfe9d6,#f3f6ee 60%,#eef1e6); z-index:5; padding:16px; box-sizing:border-box; }
  #cover .card { box-sizing:border-box; background:var(--paper); border-radius:22px; padding:28px 26px 24px; max-width:440px; width:100%; box-shadow:0 18px 50px rgba(30,70,40,.16); text-align:center; }
  #cover .kicker { color:#3f9e5c; font-weight:700; font-size:14px; }
  #cover h1 { margin:6px 0 10px; font-size:30px; }
  #cover p { margin:0 0 18px; color:var(--dim); font-size:15px; line-height:1.55; }
  #cover button { display:block; width:100%; border:0; border-radius:14px; padding:15px 12px; font:inherit; font-size:18px; font-weight:700; cursor:pointer; margin-top:10px; }
  #vrBtn { background:#f2a94f; color:#2a2010; }
  #vrBtn[disabled] { background:#e7e1d6; color:#9a93a6; cursor:default; }
  #mrBtn { background:#5cc3b4; color:#0f2a26; }
  #flatBtn { background:#e4ece0; color:var(--ink); }
  #note { margin-top:12px; font-size:13px; color:var(--dim); min-height:1em; }
  #credit { margin-top:10px; font-size:11px; color:#9a93a6; }
  #sndBtn { top:auto !important; left:auto !important; right:14px !important; bottom:calc(14px + env(safe-area-inset-bottom,0px)) !important; }
  #loading { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:rgba(30,28,44,.78); color:#fff; padding:8px 14px; border-radius:20px; font-size:13px; z-index:6; }
</style>
</head>
<body>
<div id="cover">
  <div class="card">
    <div class="kicker">휴먼쌤 월드 · 한국어 배우기</div>
    <h1>편의점에 가요</h1>
    <p>동네 편의점에서 물건 이름과 값을 듣고, 점원 하나에게 "어디 있어요?" 물어 바구니에 담은 뒤 계산까지 해 봐요. 약 10분.<br>휴대폰·PC 화면으로 보거나, <b>안드로이드 휴대폰</b>·퀘스트 3에서 내 방에 띄워 볼 수 있어요.</p>
    <button id="mrBtn" type="button" style="display:none">내 방에서 시작 (혼합현실)</button>
    <button id="vrBtn" type="button" disabled>VR 확인 중…</button>
    <button id="flatBtn" type="button">화면으로 보기</button>
    <div id="note"></div>
    <div id="credit">점원 캐릭터는 Tripo로 제작. 하나 목소리는 AI 음성 합성(Qwen3-TTS, Apache-2.0). 가게와 상품은 코드로 그린 가상 가게(실제 상표 없음), 값은 배우기 쉬운 예시. 글은 모두 확인 전 초안.</div>
  </div>
</div>
<div id="loading">불러오는 중…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="../world1/audio.js" charset="utf-8"></script>
<script src="../vr-core/core.js" charset="utf-8"></script>
<script src="content.js" charset="utf-8"></script>
<script src="voice/voice.js" charset="utf-8"></script>
<script src="space.js" charset="utf-8"></script>
<script src="store.js" charset="utf-8"></script>
</body>
</html>
